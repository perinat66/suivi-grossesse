<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de grossesse</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Suivi grossesse">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E8ECF0; --ink:#17212B; --muted:#5B6876; --line:#D8DEE4;
  --accent:#7A2E63; --accent-ink:#FFFFFF; --accent-soft:#F4E7F0;
  --ok:#2E7656; --ok-soft:#E2F1E9; --warn:#935600; --warn-soft:#FBEFD8; --bad:#B42318; --bad-soft:#FBE6E3;
  --radius:14px;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#18202A; --surface-2:#232D38; --ink:#E7ECF1; --muted:#9BA8B5; --line:#2D3844;
    --accent:#DA8EC4; --accent-ink:#2A0F22; --accent-soft:#3A2335;
    --ok:#6CC59A; --ok-soft:#163528; --warn:#E9B24E; --warn-soft:#3A2B12; --bad:#F28B82; --bad-soft:#3C1C1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#18202A; --surface-2:#232D38; --ink:#E7ECF1; --muted:#9BA8B5; --line:#2D3844;
  --accent:#DA8EC4; --accent-ink:#2A0F22; --accent-soft:#3A2335;
  --ok:#6CC59A; --ok-soft:#163528; --warn:#E9B24E; --warn-soft:#3A2B12; --bad:#F28B82; --bad-soft:#3C1C1A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 10px;max-width:760px;margin:0 auto}
.top-row{display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:1.15rem;flex:1;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;padding:8px 10px}
.btn.small{min-height:32px;padding:4px 12px;font-size:.9rem}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 8px;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* List */
.summary{margin:14px 2px 4px;color:var(--muted)}
.summary strong{color:var(--ink);font-size:1.6rem;display:block;line-height:1.15}
.search{display:flex;gap:8px;margin:12px 0 4px}
.search input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.search select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px}
.group{margin-top:18px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 6px}
.group-h h2{font-size:1.02rem;margin:0}
.group-h h2 span{color:var(--muted);font-weight:400}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:4px}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden}
.row{display:flex;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;align-items:flex-start;border-top:1px solid var(--line)}
.card > .row:first-child{border-top:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:#fff;background:var(--c)}
.rmain{flex:1;min-width:0}
.nm{font-weight:700;display:block}
.trio{display:grid;grid-template-columns:repeat(3,auto);gap:2px 14px;justify-content:start;margin-top:2px}
.trio small{display:block;color:var(--muted);font-size:.75rem}
.trio span{font-size:.92rem}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.prog{display:block;height:4px;background:var(--surface-2);border-radius:4px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.prog.over i{background:var(--bad)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* Detail */
.back{margin:8px 0 0}
.hero{background:var(--surface);border-radius:var(--radius);padding:18px 16px;margin-top:10px}
.hero h1{margin:0;font-size:1.6rem;line-height:1.15}
.hero .sub{color:var(--muted);margin-top:4px}
.ga-big{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:14px}
.ga-big .v{font-size:2.3rem;font-weight:700;line-height:1}
.ga-big .l{color:var(--muted);font-size:.85rem}
.ruler{margin-top:16px}
.ruler svg{width:100%;height:auto;display:block}
.sec{margin-top:22px}
.sec > h2{font-size:1.02rem;margin:0 4px 8px;display:flex;justify-content:space-between;align-items:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.card > .kv:first-child{border-top:0}
.kv .k{color:var(--muted)}
.kv .v{text-align:right;font-weight:700}
.txt{padding:11px 14px;border-top:1px solid var(--line);white-space:pre-wrap}
.card > .txt:first-child{border-top:0}
.txt .k{display:block;color:var(--muted);font-size:.82rem}
.ms{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.card > .ms:first-child{border-top:0}
.ms .mn{flex:1;min-width:0}
.ms .mn b{display:block;font-weight:700}
.ms .mn small{color:var(--muted)}
.ms .md{text-align:right;font-size:.92rem}
.ms .md small{display:block}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.st-encours .chk{border-color:var(--accent)}
.st-depasse .chk{border-color:var(--bad)}
.st-fait .mn b{color:var(--muted);text-decoration:line-through}
.note{color:var(--muted);font-size:.85rem;margin:8px 4px 0}
.doc{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.card > .doc:first-child{border-top:0}
.doc .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;text-align:left;padding:0;font-weight:700;color:var(--accent)}
.doc small{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.inline-form{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.inline-form input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-width:0}

/* Sheet editor */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:block}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;margin:0;font-size:1.05rem;text-align:center}
.form{max-width:760px;margin:0 auto;padding:8px 16px 80px}
fieldset{border:0;margin:20px 0 0;padding:0}
legend{font-weight:700;font-size:1.02rem;padding:0 4px 8px}
.fbox{background:var(--surface);border-radius:var(--radius);padding:4px 14px 14px}
.f{display:block;margin-top:12px}
.f > span{display:block;font-size:.86rem;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.f textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.92rem;background:var(--bg)}
.seg input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.preview{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.trow{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin-top:8px;align-items:center}
.trow.g{grid-template-columns:1.3fr 1fr .9fr auto}
.trow input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-width:0;width:100%}
.x{border:0;background:var(--surface-2);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;padding:0}
.chkline{display:flex;gap:10px;align-items:center;margin-top:12px}
.chkline input{width:20px;height:20px;accent-color:var(--accent)}

/* Settings */
.msedit{padding:12px 14px;border-top:1px solid var(--line)}
.card > .msedit:first-child{border-top:0}
.msedit input,.msedit select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-width:0}
.msedit .nmin{width:100%}
.msedit .nums{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:.9rem;color:var(--muted)}
.msedit .nums input{width:58px;text-align:center}
.msedit .nums select{flex:1;min-width:140px}

/* Modal, toast, viewer */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.45);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--surface);border-radius:18px;padding:20px;max-width:420px;width:100%}
.modal h3{margin:0 0 8px}
.modal p{margin:0 0 12px;color:var(--muted)}
.modal .bx{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:50;font-weight:700;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
.viewer{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
.viewer.open{display:flex}
.viewer header{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.viewer header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer iframe{flex:1;border:0;width:100%;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--surface);border-radius:var(--radius);padding:12px 14px}
.tile b{display:block;font-size:1.45rem;line-height:1.15}
.tile span{color:var(--muted);font-size:.85rem}
.bars{padding:6px 14px 12px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(50px,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:.92rem}
.bar .bl{overflow:hidden;text-overflow:ellipsis}
.bar .bt{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .bv{text-align:right;white-space:nowrap;font-weight:700}
.bar .bv small{color:var(--muted);font-weight:400}
button.bar{border:0;background:none;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:8px}
button.bar:disabled{cursor:default}
button.bar[aria-expanded="true"] .bl{color:var(--accent);font-weight:700}
.barlist{margin:2px 0 10px;border:1px solid var(--line)}
.statnote{color:var(--muted);font-size:.82rem;padding:10px 14px 0}
details.flt{border-top:1px solid var(--line)}
details.flt summary{padding:11px 14px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;list-style:none}
details.flt summary::-webkit-details-marker{display:none}
details.flt summary::after{content:"＋";color:var(--muted)}
details.flt[open] summary::after{content:"−"}
details.flt summary small{color:var(--accent);font-weight:700;margin-left:auto;margin-right:10px}
details.flt .seg{padding:0 14px 12px;margin-top:0}
.fpad{padding:4px 14px 12px}
.fpad .grid2 input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg)}
.row.sel-on{background:var(--accent-soft)}
.selbox{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;margin-top:8px;color:#fff;font-weight:700;font-size:.85rem}
.row.sel-on .selbox{background:var(--accent);border-color:var(--accent)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.selbar b{flex:1;min-width:120px}
.kid{border:1px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin-top:10px;background:var(--bg)}
.kid-h{display:flex;justify-content:space-between;align-items:center;padding-top:8px}
.kid .f input,.kid .f select,.ppc .f input,.ppc .f select,.hrow .f input{background:var(--surface)}
.ppc,.hrow{border:1px solid var(--line);border-radius:12px;padding:2px 12px 10px;margin-top:10px;background:var(--bg)}
.fgrp{padding:14px 14px 4px;font-size:.78rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--line)}
.bblock{border-top:1px solid var(--line)} .card > .bblock:first-child{border-top:0}
.bblock h3{font-size:.95rem;margin:0;padding:12px 14px 0}
details.sgrp > summary{font-weight:700;font-size:1.02rem;padding:0 4px 8px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.sgrp > summary::-webkit-details-marker{display:none}
details.sgrp > summary::after{content:"＋";color:var(--muted)} details.sgrp[open] > summary::after{content:"−"}
.hwrap svg{width:100%;height:auto;display:block}
.hwrap{padding:4px 10px}
.hb{cursor:pointer}
.xwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.xt{border-collapse:collapse;font-size:.85rem;min-width:100%}
.xt th,.xt td{border:1px solid var(--line);padding:4px 6px;text-align:center;vertical-align:middle}
.xt thead th{background:var(--surface-2);font-weight:700;font-size:.78rem}
.xt tbody th{text-align:left;font-weight:700;background:var(--surface-2);font-size:.8rem;max-width:140px}
.xt td.z{color:var(--muted)}
.xc{border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:4px 6px;font-weight:700;min-width:44px;cursor:pointer;font-variant-numeric:tabular-nums}
.xc small{display:block;font-weight:400;font-size:.7rem}
.xc.on{background:var(--accent);color:var(--accent-ink)}
.xsel{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 8px;background:var(--bg)}
.zoom{position:fixed;inset:0;z-index:35;background:var(--bg);display:none;flex-direction:column;overflow-y:auto}
.zoom.open{display:flex}
.zoom header{position:sticky;top:0;background:var(--bg);display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.zoom header b{flex:1}
.zbody{padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 20px);max-width:1000px;width:100%;margin:0 auto}
.dginfo{margin-top:8px;font-size:.9rem}
.dginfo summary{color:var(--accent);font-weight:700;cursor:pointer}
.dginfo ul{margin:6px 0;padding-left:20px}
.dginfo p{margin:0;color:var(--muted)}
.allergy{display:flex;gap:12px;align-items:center;background:var(--bad);color:#fff;border-radius:12px;padding:10px 14px;margin:-4px 0 14px;font-weight:700;font-size:1.05rem;box-shadow:0 0 0 3px var(--bad-soft)}
.allergy span{font-size:1.5rem;line-height:1}
.allergy small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.allergy-line{background:var(--bad-soft)} .allergy-line .k{color:var(--bad);font-weight:700}
.tag.allergy{background:var(--bad);color:#fff;font-weight:700}
.vits{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vit{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:.92rem}
.vit small{display:block;color:var(--muted);font-size:.72rem}
.vit em{font-style:normal;color:var(--muted);font-size:.78rem;margin-left:6px}
.vit.hi{background:var(--bad-soft);color:var(--bad)}
.sortrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.9rem;color:var(--muted)}
.sortrow select{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;color:var(--ink)}
.agec{color:var(--muted);font-weight:400;font-size:.85rem}
.ideal{display:block;color:var(--accent);font-weight:700}
.ucode{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:10px;background:var(--bg)}
.ucode.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ucode-h small{color:var(--muted);display:block;margin-top:4px;font-size:.8rem}
.ucode .seg{margin-top:6px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ptabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px -16px 0;padding:4px 16px 6px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.ptabs button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ptabs button small{font-weight:400;opacity:.85}
.newev{display:flex;flex-wrap:wrap;gap:8px}
.rdv{display:block;color:var(--accent);font-weight:700;font-size:.88rem;margin-top:2px}
.rhbox{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.92rem}
.kv.late{background:var(--bad-soft)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.92rem}
@media (max-width:420px){
  .trio{grid-template-columns:auto auto auto;gap:2px 10px}
  .trio span{font-size:.86rem}
  .trow.g{grid-template-columns:1fr 1fr;}
}

  let z=Z[k]+(Z[k+1]-Z[k])*(x-L[k])/(L[k+1]-L[k]); z=Math.max(-3.2,Math.min(3.2,z));
  return {pct:normCdf(z)*100, ref:sex==='F'?'OMS, courbe fille':sex==='M'?'OMS, courbe garçon':'OMS, sexe non précisé'};
}
function pctLabel(x){ return x<1?'< 1':x>99?'> 99':String(Math.round(x)); }
function efw(days){ const r=whoRow(WHO_ALL,days); return r?Math.round(r[4]):null; }

/* ---------- Stockage ----------
   1) compte Claude (capacité db, sous-arbre privé data/users/<id>) : persistant et synchronisé
   2) à défaut, IndexedDB de l’appareil
   3) à défaut, mémoire (perdu à la fermeture) */
let idb=null; const mem={patients:new Map(),files:new Map(),kv:new Map()};
const C={db:null,col:null};
let MODE='memory';
function rq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
async function openDB(){
  try{
    if(!('indexedDB' in window)) return null;
    const r=indexedDB.open('suivi-grossesse',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('patients',{keyPath:'id'}); const f=d.createObjectStore('files',{keyPath:'id'}); f.createIndex('patientId','patientId'); d.createObjectStore('kv'); };
    const d=await withTimeout(rq(r),4000); if(!d) return null;
    const t=d.transaction('kv','readwrite').objectStore('kv'); await rq(t.put(Date.now(),'_test'));   // vérifie qu’on peut réellement écrire
    return d;
  }catch(e){ return null; }
}
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return false;
    const r=await withTimeout(Promise.all([window.claude.use('db'),window.claude.use('user')]),9000);
    if(!r || !r[0] || !r[1]) return false;
    const uid=await r[1].id(); if(!uid) return false;
    C.db=r[0]; C.col=r[0].collection('data/users/'+uid);
    await C.col.limit(1).get();
    return true;
  }catch(e){ C.db=null; C.col=null; return false; }
}
const clean=o=>JSON.parse(JSON.stringify(o));
const strip=o=>{ const x=clean(o); delete x.kind; return x; };
const CHUNK=180000;
function b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; }
async function cQuery(kind,extra){ let q=C.col.where('kind','==',kind); if(extra) q=q.where(extra[0],'==',extra[1]); const sn=await q.limit(1000).get(); return sn.docs.map(d=>strip(d.data())); }
async function cGetFile(fid){
  const m=await C.col.doc(fid).get(); if(!m.exists) return null; const meta=strip(m.data());
  const parts=await Promise.all(Array.from({length:meta.chunks||0},(_,i)=>C.col.doc('c-'+fid+'-'+i).get()));
  meta.data=unb64(parts.map(p=>p.exists?p.data().d:'').join('')); return meta;
}
async function cPutFile(f){
  const s=b64(f.data); const n=Math.ceil(s.length/CHUNK)||1;
  for(let i=0;i<n;i++) await C.col.doc('c-'+f.id+'-'+i).set({kind:'chunk',fid:f.id,i,d:s.slice(i*CHUNK,(i+1)*CHUNK)});
  await C.col.doc(f.id).set({kind:'file',id:f.id,patientId:f.patientId,cat:f.cat||'',name:f.name,type:f.type,size:f.size,addedAt:f.addedAt,chunks:n});
}
async function cDelFile(fid){ const m=await C.col.doc(fid).get(); const n=m.exists?(m.data().chunks||0):0; await C.col.doc(fid).delete(); for(let i=0;i<n;i++) await C.col.doc('c-'+fid+'-'+i).delete(); }

function store(n,mode){ return idb.transaction(n,mode||'readonly').objectStore(n); }
async function getAll(n){
  if(MODE==='cloud'){ if(n==='patients') return cQuery('patient'); if(n==='files'){ const ms=await cQuery('file'); const out=[]; for(const m of ms){ const f=await cGetFile(m.id); if(f) out.push(f); } return out; } return []; }
  return idb ? rq(store(n).getAll()) : [...mem[n].values()];
}
async function put(n,v,k){
  if(MODE==='cloud'){ if(n==='patients') return C.col.doc(v.id).set(Object.assign(clean(v),{kind:'patient'})); if(n==='kv') return C.col.doc(k).set({kind:'kv',value:clean(v)}); if(n==='files') return cPutFile(v); }
  if(idb) return rq(k!==undefined?store(n,'readwrite').put(v,k):store(n,'readwrite').put(v)); mem[n].set(k!==undefined?k:v.id,v);
}
async function del(n,k){
  if(MODE==='cloud'){ if(n==='files') return cDelFile(k); return C.col.doc(k).delete(); }
  if(idb) return rq(store(n,'readwrite').delete(k)); mem[n].delete(k);
}
async function get(n,k){
  if(MODE==='cloud'){ if(n==='files') return cGetFile(k); const d=await C.col.doc(k).get(); if(!d.exists) return undefined; return n==='kv'?clean(d.data().value):strip(d.data()); }
  return idb ? rq(store(n).get(k)) : mem[n].get(k);
}
async function filesFor(pid){
  if(MODE==='cloud') return cQuery('file',['patientId',pid]);
  if(idb) return rq(store('files').index('patientId').getAll(pid)); return [...mem.files.values()].filter(f=>f.patientId===pid);
}
async function clearAll(){
  if(MODE==='cloud'){ for(const kind of ['patient','file','chunk']){ const sn=await C.col.where('kind','==',kind).limit(1000).get(); for(const d of sn.docs) await C.col.doc(d.id).delete(); } await C.col.doc('settings').delete(); return; }
  for(const n of ['patients','files','kv']){ if(idb) await rq(store(n,'readwrite').clear()); else mem[n].clear(); }
}
/* Copie unique des données déjà présentes sur l’appareil vers le compte */
async function migrateLocalToCloud(){
  if(!idb) return 0;
  try{
    const done=await rq(store('kv').get('migratedToCloud')); if(done) return 0;
    const pats=await rq(store('patients').getAll()); if(!pats.length){ await rq(store('kv','readwrite').put(Date.now(),'migratedToCloud')); return 0; }
    const existing=new Set((await cQuery('patient')).map(p=>p.id));
    const lset=await rq(store('kv').get('settings')); if(lset && !(await C.col.doc('settings').get()).exists) await C.col.doc('settings').set({kind:'kv',value:clean(lset)});
    let n=0; for(const p of pats){ if(existing.has(p.id)) continue; await C.col.doc(p.id).set(Object.assign(clean(p),{kind:'patient'})); n++; }
    for(const f of await rq(store('files').getAll())){ if(!(await C.col.doc(f.id).get()).exists) await cPutFile(f); }
    await rq(store('kv','readwrite').put(Date.now(),'migratedToCloud'));
    return n;
  }catch(e){ return 0; }
}

/* ---------- Calculs obstétricaux ---------- */
function baseT(p){
  const T=S.settings.termDays;
  switch(p.datingMethod){
    case 'dg':   { const d=parseD(p.dg); return d==null?null:d-14*DAY; }
    case 'echo': { const d=parseD(p.echoDate); if(d==null || p.echoSA==='' || p.echoSA==null) return null; return d-((+p.echoSA||0)*7+(+p.echoJ||0))*DAY; }
    case 'dpa':  { const d=parseD(p.dpaManual); return d==null?null:d-T*DAY; }
    default:     { const d=parseD(p.ddr); if(d==null) return null; const c=+p.cycle||S.settings.cycle||28; return d+(c-28)*DAY; }
  }
}
function info(p,at){
  const b=baseT(p); if(b==null) return {ok:false};
  const t=at||today(); const dpa=b+S.settings.termDays*DAY;
  return {ok:true, base:b, ga:Math.round((t-b)/DAY), dpa, toDpa:Math.round((dpa-today())/DAY)};
}
function uterusCic(p){ return (+p.cesariennes>0) || !!p.uterusCicatriciel; }
function applies(p,c){
  switch(c){ case 'rhneg': return p.rhesus==='-' && p.rhesusConj!=='-' && !rhdNegConfirmed(p); case 'cesar': return uterusCic(p); case 'dgrisk': return !!p.dgRisk;
    case 'multi': return +p.parite>0; case 'primi': return !(+p.parite>0); case 'multiple': return +p.multiple>1; default: return true; }
}
function milestonesFor(p,inf){
  const t=today(); const out=[];
  for(const m of S.settings.milestones){
    if(!applies(p,m.cond)) continue;
    const s=inf.base+m.s*DAY, e=inf.base+((m.e==null?m.s:m.e))*DAY;
    const done=(p.done||{})[m.id]; const rv=(p.rdv||{})[m.id], rd=rv?parseD(rv.date):null;
    const st= done?'fait': rd!=null?(t<rd?'avenir':t===rd?'encours':'depasse'): t<s?'avenir': t<=e?'encours':'depasse';
    out.push({kind:'ms', id:m.id, name:m.name, sDays:m.s, eDays:m.e, s, e, st, done, byEval:!!(p.doneBy||{})[m.id], idealDays:m.ideal, ideal:m.ideal!=null?inf.base+m.ideal*DAY:null, rdv:rd, rv, time:rv&&rv.time, auto:m.auto});
  }
  if(p.rhesus==='-' && p.rhesusConj!=='-'){
    const Rr=rhdResults(p);
    const mk=(id,name,s0,e0,res)=>{ const s=inf.base+s0*DAY,e=inf.base+e0*DAY; const rv=(p.rdv||{})[id], rd=rv?parseD(rv.date):null; const done=res?(res.date||iso(t)):(p.done||{})[id];
      out.push({kind:'ms',id,name:name+(res?' : '+res.res.toLowerCase():''),sDays:s0,eDays:e0,s,e,st:done?'fait':rd!=null?(t<rd?'avenir':t===rd?'encours':'depasse'):t<s?'avenir':t<=e?'encours':'depasse',done,rdv:rd,rv,time:rv&&rv.time}); };
    mk('rhd1','Génotypage RhD fœtal (1re détermination)',77,104,Rr[0]);
    if(Rr[0]&&Rr[0].res!=='Positif'){ const d0=parseD(Rr[0].date); const g=d0!=null?Math.round((d0-inf.base)/DAY):0; mk('rhd2','Génotypage RhD fœtal (contrôle à ≥ 15 j, après 15 SA)',Math.max(106,g+15),195,Rr[1]); }
  }
  const pl=p.planned;
  if(pl && pl.type){
    const s=inf.base+266*DAY, e=inf.base+273*DAY, d=parseD(pl.date); const done=(p.done||{}).plan;
    const ref=d!=null?d:e;
    out.push({kind:'plan', id:'plan', name:pl.type+(planMotifs(pl).length?' – '+planMotifs(pl).join(', '):''), sDays:266, eDays:273, s, e, st:done?'fait':today()<(d!=null?d:s)?'avenir':today()<=ref?'encours':'depasse', done, exact:d});
  }
  const V=S.settings.vacc||{};
  for(const [k,id,name,sa0,sa1] of [['grippe','vgrippe','Vaccin grippe',14,null],['covid','vcovid','Vaccin Covid-19',14,null],['vrs','vrs','Vaccin VRS',224,258]]){
    const c=V[k]; if(!c||!c.on||!/^\d{2}-\d{2}$/.test(c.from||'')||!/^\d{2}-\d{2}$/.test(c.to||'')) continue;
    const A=inf.base+sa0*DAY, B=sa1==null?inf.dpa:inf.base+sa1*DAY;
    const [fm,fdd]=c.from.split('-').map(Number), [tm,tdd]=c.to.split('-').map(Number);
    for(let y=new Date(A).getUTCFullYear()-1;y<=new Date(B).getUTCFullYear();y++){
      const ss=Date.UTC(y,fm-1,fdd), se=Date.UTC((tm*100+tdd)<(fm*100+fdd)?y+1:y,tm-1,tdd);
      const s=Math.max(A,ss), e=Math.min(B,se); if(s>e) continue;
      const mid=id+'-'+y; const done=(p.done||{})[mid];
      const yy=new Date(ss).getUTCFullYear(), ye=new Date(se).getUTCFullYear();
      out.push({kind:'ms',id:mid,name:name+' (campagne '+(yy===ye?yy:yy+'-'+ye)+')',sDays:Math.round((s-inf.base)/DAY),eDays:Math.round((e-inf.base)/DAY),s,e,st:done?'fait':t<s?'avenir':t<=e?'encours':'depasse',done});
    }
  }
  for(const ev of (p.events||[])){
    const d=parseD(ev.date); if(d==null) continue;
    const done=(p.done||{})[ev.id];
    out.push({kind:'ev', id:ev.id, name:ev.name, evKind:ev.kind, time:ev.time, note:ev.note, s:d, e:d, st: done?'fait': d<t?'depasse': d===t?'encours':'avenir', done, ga:Math.round((d-inf.base)/DAY)});
  }
  out.push({kind:'dpa', id:'dpa', name:'Jour du terme prévu', s:inf.dpa, e:inf.dpa, sDays:S.settings.termDays, st: t>inf.dpa?'depasse':t===inf.dpa?'encours':'avenir'});
  out.sort((a,b)=>a.s-b.s || a.e-b.e);
  return out;
}
function conge(p,inf){
  const mult=+p.multiple||1, par=+p.parite||0;
  let pre, post;
  if(mult>=3){ pre=24; post=22; } else if(mult===2){ pre=12; post=22; } else if(par>=2){ pre=8; post=18; } else { pre=6; post=10; }
  return {pre, post, start:inf.dpa-pre*7*DAY, end:inf.dpa+post*7*DAY};
}

async function deletePatients(ids){
  let n=0;
  for(const id of ids){ try{ for(const f of await filesFor(id)) await del('files',f.id); await del('patients',id); S.patients=S.patients.filter(x=>x.id!==id); n++; }catch(e){ toast('Un dossier n’a pas pu être supprimé, réessayez'); } }
  return n;
}

function rulerSVG(items,inf){
  const W=360, x0=14, x1=346, max=294; const X=d=>x0+(Math.max(0,Math.min(max,d))/max)*(x1-x0);
  const ms=items.filter(i=>i.kind==='ms');
  const lanes=[]; const placed=[];
  for(const m of ms){ const a=m.sDays, b=(m.eDays==null?m.sDays:m.eDays); let l=0; while(lanes[l]!=null && lanes[l]>a-2) l++; lanes[l]=b; placed.push({m,l,a,b}); }
  const nl=Math.max(1,lanes.length); const top=26, lh=8; const H=top+nl*lh+30;
  const col={fait:'var(--ok)',encours:'var(--accent)',avenir:'var(--muted)',depasse:'var(--bad)'};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Frise de la grossesse de 0 à 42 SA">`;
  s+=`<rect x="${X(0)}" y="${top-6}" width="${X(98)-X(0)}" height="${nl*lh+8}" fill="var(--surface-2)" opacity=".55"/>`;
  s+=`<rect x="${X(196)}" y="${top-6}" width="${X(max)-X(196)}" height="${nl*lh+8}" fill="var(--surface-2)" opacity=".55"/>`;
  [['T1',49],['T2',147],['T3',245]].forEach(([l,d])=>{ s+=`<text x="${X(d)}" y="12" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="700">${l}</text>`; });
  for(const p of placed){ const y=top+p.l*lh; const w=Math.max(4,X(p.b)-X(p.a)); s+=`<rect x="${X(p.a)}" y="${y}" width="${w}" height="5" rx="2.5" fill="${col[p.m.st]}" opacity="${p.m.st==='avenir'?.45:1}"><title>${esc(p.m.name)}</title></rect>`; }
  const by=top+nl*lh+6;
  s+=`<line x1="${x0}" x2="${x1}" y1="${by}" y2="${by}" stroke="var(--line)" stroke-width="1.5"/>`;
  for(let w=0;w<=42;w+=2){ const x=X(w*7); s+=`<line x1="${x}" x2="${x}" y1="${by}" y2="${by+(w%4?3:6)}" stroke="var(--muted)" stroke-width="1"/>`; if(w%8===0 || w===42) s+=`<text x="${x}" y="${by+17}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${w}</text>`; }
  const dx=X(S.settings.termDays); s+=`<line x1="${dx}" x2="${dx}" y1="${top-8}" y2="${by}" stroke="var(--ink)" stroke-dasharray="2 2" stroke-width="1"/>`;
  if(inf.ga>=0){ const tx=X(inf.ga); s+=`<line x1="${tx}" x2="${tx}" y1="${top-10}" y2="${by+2}" stroke="var(--accent)" stroke-width="2.5"/><circle cx="${tx}" cy="${top-10}" r="3.5" fill="var(--accent)"/>`; }
  return s+'</svg>';
}
function stLabel(it){

  const sh=$('#sheet');

}

/* ---------- Évaluation échographique ---------- */
const BISHOP_ITEMS=[['bDil','Dilatation',[['0','Fermé'],['1','1–2 cm'],['2','3–4 cm'],['3','≥ 5 cm']]],['bEff','Effacement',[['0','0–30 %'],['1','40–50 %'],['2','60–70 %'],['3','≥ 80 %']]],['bHaut','Hauteur de la présentation',[['0','Mobile (−3)'],['1','Amorcée (−2)'],['2','Fixée (−1/0)'],['3','Engagée (+1/+2)']]],['bCons','Consistance',[['0','Ferme'],['1','Moyenne'],['2','Molle']]],['bPos','Position du col',[['0','Postérieur'],['1','Intermédiaire'],['2','Antérieur']]]];
function bishopOf(e){ if(!e||!e.tv) return null; const v=BISHOP_ITEMS.map(([k])=>e[k]); if(v.some(x=>x===''||x==null)) return null; return v.reduce((a,x)=>a+(+x),0); }
function applyEvalValidation(p,e){
  p.done=p.done||{}; p.doneBy=p.doneBy||{}; const names=[];
  for(const [k,v] of Object.entries(p.doneBy)) if(v===e.id){ delete p.doneBy[k]; delete p.done[k]; }
  if(e.urg) return names;
  const inf=info(p), d=parseD(e.date); if(!inf.ok||d==null) return names;
  const mark=(id,name)=>{ p.done[id]=e.date; p.doneBy[id]=e.id; names.push(name); };
  const kindOK=a=>(a==='consult'&&e.consult!==false)||(a==='echo'&&e.echo);
  const MAP={'T1':'echo1','T2 (morphologique)':'echo2','T3':'echo3'};
  const MS=S.settings.milestones.filter(m=>m.auto&&applies(p,m.cond));
  if(e.echo&&MAP[e.etype]){ const m=MS.find(x=>x.id===MAP[e.etype]); if(m&&!p.done[m.id]) mark(m.id,m.name); }
  for(const m of MS){ if(p.done[m.id]||!kindOK(m.auto)) continue; const rv=(p.rdv||{})[m.id]; if(rv&&rv.date===e.date&&!(m.auto==='echo'&&e.etype&&MAP[e.etype]!==m.id)) mark(m.id,m.name); }
  for(const ev of list(p.events)){ if(p.done[ev.id]||ev.date!==e.date) continue; if(ev.kind==='consult'&&e.consult!==false||ev.kind==='echo'&&e.echo) mark(ev.id,ev.name); }
  for(const m of MS){ if(p.done[m.id]||!kindOK(m.auto)) continue; if(m.auto==='echo'&&e.etype&&MAP[e.etype]!==m.id) continue;
    const s=inf.base+m.s*DAY, en=inf.base+((m.e==null?m.s:m.e))*DAY; if(d<s||d>en) continue;
    mark(m.id,m.name); if(p.rdv&&p.rdv[m.id]&&p.rdv[m.id].date!==e.date) p.rdv[m.id].date=e.date; }
  return names;
}

function openEval(p,evId,preset){
  const ex=evId?list(p.evals).find(e=>e.id===evId):null;
  const e=Object.assign({id:uid('e'),date:iso(today()),urg:!!(preset&&preset.urg),etype:'',motif:'',poidsM:'',pas:'',pad:'',presentation:'',epf:'',pct:'',placPos:'',placIns:'',placDist:'',colLong:'',oi:'',oiMm:'',notes:''},ex?JSON.parse(JSON.stringify(ex)):(preset?{consult:!!preset.consult,echo:!!preset.echo}:{}));
  const sh=$('#sheet');
  const tin=(n,ph)=>`<input name="${n}" type="text" inputmode="decimal" placeholder="${ph||''}" value="${esc(e[n]??'')}">`;
  sh.innerHTML=`<div class="sheet-h"><button class="btn ghost" id="eCancel">Annuler</button><h2 id="sheetTitle">${ex?'Consultation / échographie':(preset&&preset.echo?'Échographie':'Consultation')+(preset&&preset.urg?' d’urgence':' programmée')}</h2><button class="btn primary" id="eSave">Enregistrer</button></div>
  <div class="form">
   <fieldset><legend>Date</legend><div class="fbox">${F('Date de l’examen','<input type="date" name="date" value="'+esc(e.date)+'">')}<div class="preview num" id="eAg"></div></div></fieldset>
   <fieldset><legend>Type d’examen</legend><div class="fbox">
    <div class="seg"><label><input type="checkbox" name="etC" ${e.consult!==false?'checked':''}><span>Consultation</span></label><label><input type="checkbox" name="etE" ${e.echo?'checked':''}><span>Échographie</span></label></div>
    <div class="f"><span>Caractère</span>${radios('eurg',[['prog','Programmé(e)'],['urg','Urgence']],e.urg?'urg':'prog')}</div>
    <div id="eTypeBox"><label class="f"><span>Type d’échographie</span><select name="etype"><option value="">—</option>${ECHO_TYPES.map(x=>`<option ${e.etype===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div>
    <div id="eUrgBox">${F('Motif de la venue en urgence','<input name="eMotif" value="'+esc(e.motif||'')+'">')}</div>
    <div class="note" style="margin:8px 0 0">Programmé(e) : valide automatiquement le rendez-vous prévu correspondant. Urgence : ne valide aucun rendez-vous.</div>
   </div></fieldset>
   <fieldset><legend>Mère</legend><div class="fbox">
    <div class="grid3">${F('Poids (kg)',tin('poidsM','ex. 68,5'))}${F('TA systolique',tin('pas','mmHg'))}${F('TA diastolique',tin('pad','mmHg'))}</div>
    <div class="preview num" id="eGain" style="display:none"></div>
   </div></fieldset>
   <fieldset><legend>Fœtus</legend><div class="fbox">
    <div class="f"><span>Présentation</span>${radios('presentation',PRES.map(x=>[x,x]),e.presentation)}</div>
    <div class="grid2">${F('Poids fœtal estimé (g)',tin('epf','ex. 2350'))}${F('Percentile (calculé)',tin('pct','auto'))}</div>
    <div class="note" id="ePctSrc" style="margin:6px 0 0"></div>
    <div class="preview" id="eCat" style="display:none"></div>
   </div></fieldset>
   <fieldset><legend>Toucher vaginal</legend><div class="fbox">
    <label class="chkline"><input type="checkbox" name="tv" ${e.tv?'checked':''}> TV réalisé</label>
    <div id="tvBox">${BISHOP_ITEMS.map(([k,l,o])=>`<div class="f"><span>${l}</span>${radios(k,o.map(([v,t])=>[v,t+' ('+v+')']),e[k]??'')}</div>`).join('')}
     <div class="preview num" id="bScore"></div>
     ${F('Autres constatations (membranes, liquide…)','<input name="tvNotes" value="'+esc(e.tvNotes||'')+'">')}</div>
   </div></fieldset>
   <fieldset><legend>Placenta</legend><div class="fbox">
    <div class="f"><span>Position</span>${radios('placPos',PLAC_POS.map(x=>[x,x]),e.placPos)}</div>
    <div class="f"><span>Insertion</span>${radios('placIns',PLAC_INS.map(x=>[x,x]),e.placIns)}</div>
    <div id="eDist">${F('Distance bord placentaire – orifice interne (mm)',tin('placDist'))}</div>
   </div></fieldset>
   <fieldset><legend>Col</legend><div class="fbox">
    ${F('Longueur cervicale (mm)',tin('colLong'))}
    <div class="f"><span>Orifice interne (OI)</span>${radios('oi',[['Fermé','Fermé'],['Ouvert','Ouvert']],e.oi)}</div>
    <div id="eOi">${F('Ouverture de l’OI (mm)',tin('oiMm'))}</div>
   </div></fieldset>
   <fieldset><legend>Notes</legend><div class="fbox">${F('Remarques','<textarea name="notes">'+esc(e.notes||'')+'</textarea>')}</div></fieldset>
   ${ex?'<div class="actions"><button class="btn danger" id="eDel">Supprimer cette évaluation</button></div>':''}
  </div>`;
  sh.classList.add('open'); document.body.style.overflow='hidden'; sh.scrollTop=0;
  const val=n=>{ const r=sh.querySelector(`[name="${n}"]:checked`); if(r) return r.value; const el=sh.querySelector(`[name="${n}"]`); return el && el.type!=='radio' ? el.value.trim() : ''; };
  let pctManual=!!(ex&&ex.pctManual); let echoTouched=!!ex||!!preset;
  sh.addEventListener('change',ev=>{ if(ev.target.name==='etE') echoTouched=true; },true);
  sh.addEventListener('input',ev=>{ if(ev.target.name==='pct') pctManual=ev.target.value.trim()!==''; },true);
  const sync=()=>{ const d=parseD(val('date')), inf=info(p); $('#eAg').textContent=d!=null&&inf.ok?'Âge gestationnel : '+sa(Math.round((d-inf.base)/DAY)):''; 
    const g=numv(val('epf')), src=$('#ePctSrc'); const sf=(+p.multiple||1)===1?sexfArr(p)[0]:'';
    if(g!=null && d!=null && inf.ok){ const r=whoPct(g,Math.round((d-inf.base)/DAY),sf);
      if(r){ if(!pctManual) sh.querySelector('[name="pct"]').value=frn(r.pct,1); src.textContent='Percentile '+pctLabel(r.pct)+' ('+r.ref+(+p.multiple>1?' ; courbes établies pour grossesses uniques':'')+')'+(pctManual?' – valeur saisie manuellement conservée':''); }
      else src.textContent='Calcul automatique possible de 14 à 40 SA uniquement.'; } else src.textContent='';
    if(!echoTouched){ const hasEcho=['epf','pct','placDist','colLong'].some(k=>val(k)!=='')||val('placIns')||val('placPos'); sh.querySelector('[name="etE"]').checked=!!hasEcho; }
    $('#eTypeBox').style.display=sh.querySelector('[name="etE"]').checked?'':'none'; $('#eUrgBox').style.display=val('eurg')==='urg'?'':'none';
    const tvOn=sh.querySelector('[name="tv"]').checked; $('#tvBox').style.display=tvOn?'':'none';
    if(tvOn){ const tmpE={tv:true}; BISHOP_ITEMS.forEach(([k])=>tmpE[k]=val(k)); const b=bishopOf(tmpE); const done=BISHOP_ITEMS.filter(([k])=>val(k)!=='').length; $('#bScore').textContent=b!=null?'Score de Bishop : '+b+' / 13':'Score de Bishop : '+done+'/5 critères renseignés'; }
    const pm=numv(val('poidsM')), pa=numv(p.poidsAvant), eg=$('#eGain'); eg.style.display=pm!=null&&pa!=null?'':'none'; if(pm!=null&&pa!=null) eg.textContent='Prise de poids : '+(pm-pa>=0?'+':'')+frn(pm-pa)+' kg';
    const c=croisCat(val('pct')); const ec=$('#eCat'); ec.style.display=c?'':'none'; ec.textContent=c?'Classement : '+c:'';
    $('#eDist').style.display=/^Bas/.test(val('placIns'))?'':'none'; $('#eOi').style.display=val('oi')==='Ouvert'?'':'none'; };
  sh.oninput=sync; sh.onchange=sync; sync();
  const close=()=>{ sh.classList.remove('open'); sh.innerHTML=''; sh.oninput=sh.onchange=sh.onclick=null; document.body.style.overflow=''; };
  $('#eCancel').addEventListener('click',close);
  $('#eSave').addEventListener('click',async()=>{
    for(const k of ['date','presentation','placPos','placIns','oi','notes']) e[k]=val(k);
    for(const k of ['epf','pct','placDist','colLong','oiMm','poidsM','pas','pad']) e[k]=nstr(val(k)); e.pctManual=pctManual;
    e.consult=sh.querySelector('[name="etC"]').checked; e.echo=sh.querySelector('[name="etE"]').checked;
    e.urg=val('eurg')==='urg'; e.etype=e.echo?val('etype'):''; e.motif=e.urg?val('eMotif'):'';
    e.tv=sh.querySelector('[name="tv"]').checked; for(const [k] of BISHOP_ITEMS) e[k]=e.tv?val(k):''; e.tvNotes=e.tv?val('tvNotes'):''; e.bishop=bishopOf(e); if(e.bishop==null) e.bishop='';
    if(!/^Bas/.test(e.placIns)) e.placDist=''; if(e.oi!=='Ouvert') e.oiMm='';
    p.evals=list(p.evals).filter(x=>x.id!==e.id); p.evals.push(e);
    const val_=applyEvalValidation(p,e); if(val_.length) setTimeout(()=>toast('Validé : '+val_.join(', ')),400);
    await savePatient(p); close(); toast('Évaluation enregistrée'); renderPatient(p.id);
  });
  const dl=$('#eDel'); if(dl) dl.addEventListener('click',async()=>{ if(!await ask({title:'Supprimer cette évaluation ?',body:'Cette action est irréversible.',ok:'Supprimer',danger:true})) return; p.evals=list(p.evals).filter(x=>x.id!==e.id); applyEvalValidation(p,{id:e.id,date:''}); await savePatient(p); close(); renderPatient(p.id); });
}
async function drawDocs(p,cat){
  const box=$('#docs'); if(!box) return;
  let fs=[]; try{ fs=await filesFor(p.id); }catch(e){}
  if(cat) fs=fs.filter(f=>f.cat===cat);
  fs.sort((a,b)=>b.addedAt-a.addedAt);
  box.innerHTML = fs.length ? fs.map(f=>`<div class="doc"><span aria-hidden="true">📄</span><div style="flex:1;min-width:0"><button class="dn" data-view="${esc(f.id)}">${esc(f.name)}</button><small class="num">${f.cat==='bio'?'Biologie – ':''}${fsize(f.size)} – ajouté le ${fd(localDay(f.addedAt))}</small></div><button class="x" data-delf="${esc(f.id)}" aria-label="Supprimer ${esc(f.name)}">×</button></div>`).join('')
    : '<div class="txt" style="color:var(--muted)">Aucun document. Ajoutez des comptes rendus d’échographie, des bilans ou des courriers.</div>';
  $$('[data-view]',box).forEach(b=>b.addEventListener('click',()=>viewPdf(b.dataset.view)));
  $$('[data-delf]',box).forEach(b=>b.addEventListener('click',async()=>{ const f=fs.find(x=>x.id===b.dataset.delf); if(!await ask({title:'Supprimer ce document ?',body:f.name,ok:'Supprimer',danger:true})) return; await del('files',f.id); drawDocs(p,cat); }));
}
async function addPdfs(p,files,cat){
  let n=0;
  for(const file of files){
    if(!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)){ toast(file.name+' n’est pas un PDF'); continue; }
    try{ const buf=await file.arrayBuffer(); await put('files',{id:uid('f'),patientId:p.id,cat:cat||'',name:file.name,type:'application/pdf',size:file.size,addedAt:Date.now(),data:buf}); n++; }
    catch(e){ toast('Impossible d’enregistrer '+file.name+' (espace insuffisant ?)'); }
  }
  if(n) toast(n+' document'+(n>1?'s ajoutés':' ajouté'));
  drawDocs(p,cat||null);
}
let viewing=null;
async function viewPdf(fid){
  const f=await get('files',fid); if(!f) return; viewing=f;
  const url=URL.createObjectURL(new Blob([f.data],{type:'application/pdf'}));
  $('#vName').textContent=f.name; $('#vFrame').src=url; $('#viewer').classList.add('open');
}
$('#vClose').addEventListener('click',()=>{ const fr=$('#vFrame'); if(fr.src.startsWith('blob:')) URL.revokeObjectURL(fr.src); fr.removeAttribute('src'); $('#viewer').classList.remove('open'); viewing=null; });
$('#vOpen').addEventListener('click',()=>{ const src=$('#vFrame').src; if(src) window.open(src,'_blank'); });
$('#vSave').addEventListener('click',()=>{ if(viewing) saveFile(viewing.name.match(/\.pdf$/i)?viewing.name:viewing.name+'.pdf', new Blob([viewing.data],{type:'application/pdf'})); });

/* ---------- Dossiers liés et issue ---------- */
function idKey(p){ const n=(p.nom||'').trim().toLowerCase(), q=(p.prenom||'').trim().toLowerCase(); return n&&q&&p.naissance ? n+'|'+q+'|'+p.naissance : null; }
function related(p){ const g=p.groupId||p.id, k=idKey(p); return S.patients.filter(x=>x.id!==p.id && ((x.groupId||x.id)===g || (k && idKey(x)===k))).sort((a,b)=>pDate(b)-pDate(a)); }
function pDate(x){ const d=x.issue&&parseD(x.issue.date); if(d!=null) return d; const i=info(x); return i.ok?i.dpa:(x.createdAt||0); }
function pregLabel(x){ const i=info(x); const y=new Date(pDate(x)).getUTCFullYear(); return x.status==='archived' ? 'Grossesse '+y : i.ok ? 'En cours – DPA '+fd(i.dpa) : 'En cours'; }
function issueSummary(x){
  const o=x.issue; if(!o || !o.type) return '';
  const i=info(x), d=parseD(o.date); const parts=[o.type];
  if(d!=null) parts.push(fd(d)); if(d!=null && i.ok) parts.push(sa(Math.round((d-i.base)/DAY)));
  for(const e of (o.enfants||[])){ const t=[SEXE[e.sexe]||'', e.prenom||'', e.poids?(+e.poids).toLocaleString('fr-FR')+' g':''].filter(Boolean).join(' '); if(t) parts.push(t.toLowerCase().startsWith('fille')||t.toLowerCase().startsWith('garçon')?t.charAt(0).toLowerCase()+t.slice(1):t); }
  return parts.join(', ');
}
function prevFromIssue(prev){
  const o=prev.issue||{}; const k=list(o.enfants)[0]||{}; const i=info(prev), d=parseD(o.date);
  const pm=[...list(prev.pathoMat),...list(prev.pathoFoet)], cm=complMat(prev);
  return { annee:String(d!=null?new Date(d).getUTCFullYear():new Date(pDate(prev)).getUTCFullYear()), lieu:lieuLabel(o)||lieuLabel(prev), issue:o.type||'',
    terme:d!=null&&i.ok?sa(Math.round((d-i.base)/DAY)):'', presentation:o.presentation||'', sexe:k.sexe||'', prenom:k.prenom||'', poids:k.poids||'',
    anesth:o.analgesie||'', perinee:o.perinee||'', delivrance:o.hdd==='oui'?'Hémorragie de la délivrance':o.delivrance==='Délivrance artificielle'?'Délivrance artificielle':o.delivrance==='Révision utérine'?'Révision utérine':(o.type?'Normale':''),
    grossesse:o.type?(pm.length?'Pathologique':'Normale'):'', grossessePrec:pm.join(', '), suites:o.type?(cm.length?'Pathologiques':'Normales'):'', suitesPrec:cm.join(', '), allaitement:o.alim||'' };
}
function prefillFrom(prev){
  const o=prev.issue||{}; const birth=BIRTH.has(o.type), ces=/Césarienne/.test(o.type||'');
  const num=v=>v===''||v==null?null:+v;
  const g=num(prev.gestite), pa=num(prev.parite);
  return {
    groupId:prev.groupId||prev.id, nom:prev.nom, prenom:prev.prenom, naissance:prev.naissance, telephone:prev.telephone, taille:prev.taille,
    groupe:prev.groupe, rhesus:prev.rhesus, atcdMed:prev.atcdMed, atcdChir:prev.atcdChir, allergies:prev.allergies, atcdObst:prev.atcdObst,
    prevPreg:[...JSON.parse(JSON.stringify(list(prev.prevPreg))), prevFromIssue(prev)],
    ttFond:JSON.parse(JSON.stringify(prev.ttFond||[])), uterusCicatriciel:prev.uterusCicatriciel,
    gestite: g==null?'':g+1, parite: pa==null?(birth?1:''):pa+(birth?1:0), cesariennes:(+prev.cesariennes||0)+(ces?1:0),
    lieu:prev.lieu, lieuPrec:prev.lieuPrec, niveau:prev.niveau, corr:JSON.parse(JSON.stringify(prev.corr||[]))
  };
}
function kidText(e){ return [SEXE[e.sexe]||'', e.prenom||'', numv(e.poids)!=null?frn(numv(e.poids),0)+' g':'', numv(e.ph)!=null?'pH '+frn(numv(e.ph),2):'', numv(e.lact)!=null?'lactates '+frn(numv(e.lact))+' mmol/L':'', [e.apg1,e.apg5,e.apg10].some(x=>x!==''&&x!=null)?'Apgar '+[e.apg1,e.apg5,e.apg10].map(x=>x===''||x==null?'–':x).join('/'):''].filter(Boolean).join(' – '); }
function issueRows(p,inf){
  const o=p.issue||{}; const d=parseD(o.date); const rows=[];
  const add=(k,v)=>{ if(v) rows.push([k,v]); };
  add('Issue',o.type); add('Date',d!=null?fd(d):''); add('Terme',d!=null&&inf.ok?sa(Math.round((d-inf.base)/DAY)):''); add('Lieu',lieuLabel(o));
  add('Entrée en travail',o.travail);
  if(o.travail==='Déclenchement'){ add('Motif du déclenchement',list(o.declMotifs).join(', ')); add('Méthode',list(o.declMeth).join(', ')); }
  add('Présentation à la naissance',o.presentation);
  if(/Césarienne/.test(o.type||'')){ add('Motif de la césarienne',list(o.cesMotifs).join(', ')); if(o.code) add('Code d’urgence','Code '+o.code.toLowerCase()); if(numv(o.delai)!=null) add('Délai décision – naissance',frn(numv(o.delai),0)+' min'+(o.hDec&&o.hNais?' ('+o.hDec+' → '+o.hNais+')':'')); }
  if(o.type==='Voie basse instrumentale'){ add('Instrument',o.instrument); add('Motif de l’extraction',list(o.instrMotifs).join(', ')); }
  add('Analgésie',o.analgesie); add('Périnée',o.perinee); add('Délivrance',o.delivrance);
  add('Hémorragie de la délivrance',o.hdd==='oui'?'Oui'+(o.hddVol?' ('+frn(numv(o.hddVol),0)+' mL)':''):o.hdd==='non'?'Non':'');
  list(o.enfants).forEach((e,i,a)=>add(a.length>1?'Enfant '+(i+1):'Enfant',kidText(e)));
  add('Alimentation',o.alim); add('Complications maternelles',complMat(p).join(', ')); add('Complications néonatales',list(o.complNeo).join(', ')); add('Notes',o.notes);
  return rows;
}
function issueHTML(p,inf){
  const o=p.issue||{}; const rows=issueRows(p,inf);
  const code=o.code&&/Césarienne/.test(o.type||'')?`<div class="txt"><span class="tag ${codeCls(o.code)}">Code ${esc(o.code.toLowerCase())}</span></div>`:'';
  const body=rows.map(([k,v])=>k==='Notes'?`<div class="txt"><span class="k">Notes</span>${esc(v)}</div>`:`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('');
  return `<section class="sec"><h2>Issue de la grossesse <button class="link" id="editIssue">${rows.length?'Modifier':'Renseigner'}</button></h2><div class="card num">${code}${body||'<div class="txt" style="color:var(--muted)">Dossier archivé sans renseignement.</div>'}</div></section>`;
}

  const t=(k,ph,mode)=>`<label class="f"><span>${ph}</span><input data-k="${k}" type="text" inputmode="${mode||'decimal'}" value="${esc(e[k]??'')}"></label>`;
  return `<div class="kid"><div class="kid-h"><b>Enfant</b><button type="button" class="x" data-rmk aria-label="Retirer cet enfant">×</button></div>
  <div class="grid3"><label class="f"><span>Sexe</span><select data-k="sexe"><option value=""></option>${Object.entries(SEXE).map(([k,l])=>`<option value="${k}" ${e.sexe===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <label class="f"><span>Prénom</span><input data-k="prenom" value="${esc(e.prenom||'')}"></label>${t('poids','Poids (g)','numeric')}</div>
  <div class="grid2">${t('ph','pH au cordon')}${t('lact','Lactates (mmol/L)')}</div>
  <div class="grid3">${t('apg1','Apgar 1 min','numeric')}${t('apg5','Apgar 5 min','numeric')}${t('apg10','Apgar 10 min','numeric')}</div></div>`;
}
function openOutcome(p){
  const wasActive=p.status!=='archived';
  const o=Object.assign({type:'',date:'',hdd:'',hddVol:'',perinee:'',analgesie:'',delivrance:'',lieu:p.lieu||'',lieuPrec:p.lieuPrec||'',enfants:[],alim:'',notes:'',complMat:[],complNeo:[],travail:'',declMotifs:[],declMeth:[],cesMotifs:[],code:'',hDec:'',hNais:'',delai:'',instrument:'',instrMotifs:[],presentation:''},JSON.parse(JSON.stringify(p.issue||{})));
  if(!o.enfants.length){ const sf=sexfArr(p); o.enfants=sf.map(s=>({sexe:s==='F'||s==='M'?s:''})); }
  if(!p.issue && p.planned && p.planned.type){ const pl=p.planned;
    if(pl.type==='Déclenchement programmé'){ o.travail='Déclenchement'; o.declMotifs=planMotifs(pl); }
    else { o.type='Césarienne programmée'; o.travail='Césarienne avant travail'; o.cesMotifs=planMotifs(pl); }
    if(pl.date && !o.date) o.date=pl.date; }
  if(!o.presentation){ const lp=lastField(p,'presentation'); if(lp && lp.v!=='Instable') o.presentation=lp.v; }
  const sh=$('#sheet');
  const sel=(n,opts,v)=>`<select name="${n}"><option value="">—</option>${opts.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  const other=(n,arr,base)=>F('Autre(s) (séparés par des virgules)',`<input name="${n}" value="${esc(list(arr).filter(x=>!base.includes(x)).join(', '))}">`);
  sh.innerHTML=`<div class="sheet-h"><button class="btn ghost" id="oCancel">Annuler</button><h2 id="sheetTitle">Issue de la grossesse</h2><button class="btn primary" id="oSave">${wasActive?'Archiver':'Enregistrer'}</button></div>
  <div class="form">
   ${wasActive?'<div class="banner" style="background:var(--surface);color:var(--ink)">Tous les champs sont facultatifs. <button type="button" class="link" id="oQuick">Archiver sans rien renseigner</button></div>':''}
   <fieldset><legend>Issue</legend><div class="fbox">
    <label class="f"><span>Issue</span><select name="type"><option value="">—</option>${ISSUE_GROUPS.map(([g,a])=>`<optgroup label="${g}">${a.map(x=>`<option ${o.type===x?'selected':''}>${esc(x)}</option>`).join('')}</optgroup>`).join('')}</select></label>
    ${F('Date','<input type="date" name="date" value="'+esc(o.date)+'">')}
    <div class="f"><span>Lieu</span>${radios('lieu',LIEUX.map(x=>[x,x]),o.lieu)}</div>
    ${F('Précision (autre établissement)','<input name="lieuPrec" value="'+esc(o.lieuPrec||'')+'">')}
    <div class="preview num" id="oTerm" style="display:none"></div>
   </div></fieldset>
   <div id="birthBox">
   <fieldset><legend>Travail</legend><div class="fbox">

let jsPDFp=null;
function loadJsPDF(){ if(window.jspdf) return Promise.resolve(window.jspdf.jsPDF); if(!jsPDFp) jsPDFp=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; s.onload=()=>res(window.jspdf.jsPDF); s.onerror=()=>{ jsPDFp=null; rej(new Error('load')); }; document.head.appendChild(s); }); return jsPDFp; }
function pdfTxt(s){ return String(s==null?'':s).replace(/[\u202F\u00A0]/g,' ').replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/−/g,'-').replace(/œ/g,'oe').replace(/Œ/g,'OE').replace(/→/g,'->').replace(/✓/g,'x').replace(/²/g,'2'); }
async function makePDF(p,ids){
  const JsPDF=await loadJsPDF();
  const doc=new JsPDF({unit:'mm',format:'a4'}); const W=210, M=16, KW=58; let y=18;
  const page=()=>{ doc.addPage(); y=18; };
  const need=hh=>{ if(y+hh>282) page(); };
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(pdfTxt('Dossier de suivi de grossesse'),M,y); y+=8;
  doc.setFontSize(12); doc.text(pdfTxt(fullName(p)),M,y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text(pdfTxt('Document édité le '+fd(today())+' – informations confidentielles'),M,y); doc.setTextColor(0); y+=8;
  for(const s of pdfSections(p).filter(s=>ids.includes(s.id))){
    need(14); doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(122,46,99); doc.text(pdfTxt(s.title),M,y); doc.setTextColor(0); y+=2; doc.setDrawColor(200); doc.line(M,y,W-M,y); y+=5;
    doc.setFontSize(9.5);
    for(const [k,v] of s.rows){
      doc.setFont('helvetica','bold'); const kl=doc.splitTextToSize(pdfTxt(k),KW-3);
      doc.setFont('helvetica','normal'); const vl=doc.splitTextToSize(pdfTxt(v),W-2*M-KW);
      const hh=Math.max(kl.length,vl.length)*4.4+1.6; need(hh);
      doc.setFont('helvetica','bold'); if(k==='ALLERGIES') doc.setTextColor(180,35,24); doc.text(kl,M,y); doc.setFont('helvetica','normal'); doc.text(vl,M+KW,y); doc.setTextColor(0); y+=hh;
    }
    y+=4;
  }
  const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text(pdfTxt(fullName(p)+' – page '+i+'/'+n),W-M,291,{align:'right'}); }
  return doc.output('blob');
}
function printFallback(p,ids){

  const recs=child?F.flatMap(p=>kidsOf(p).map(k=>({p,k}))):F.map(p=>({p,k:null}));
  const cells=new Map(), rows=new Set(), cols=new Set(), rowTot=new Map();
  for(const r of recs){ const rv=uniq(dimVals(dr,r.p,r.k)), cv=uniq(dimVals(dc,r.p,r.k)); if(!rv.length||!cv.length) continue;
    for(const a of rv){ rows.add(a); rowTot.set(a,(rowTot.get(a)||0)+1); for(const b of cv){ cols.add(b); const key=a+'\u0001'+b; const e=cells.get(key)||{n:0,ids:new Set()}; e.n++; e.ids.add(r.p.id); cells.set(key,e); } } }
  if(!rows.size) return '<div class="txt" style="color:var(--muted)">Aucun dossier ne renseigne ces deux éléments.</div>';
  const ord=(d,set)=>{ const o=dimOpts(d); return [...set].sort((a,b)=>o.indexOf(a)-o.indexOf(b)); };
  const R=ord(dr,rows), Cc=ord(dc,cols); XC=new Map(); let i=0;
  let t=`<div class="xwrap"><table class="xt"><thead><tr><th>${esc(dr.short||dr.l)} \\ ${esc(dc.short||dc.l)}</th>${Cc.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  for(const r of R){ t+=`<tr><th>${esc(r)}</th>`; for(const c of Cc){ const e=cells.get(r+'\u0001'+c); if(e){ const k='x'+(i++); XC.set(k,[...e.ids]); t+=`<td><button class="xc" data-xc="${k}">${e.n}<small>${pct(e.n,rowTot.get(r))}</small></button></td>`; } else t+='<td class="z">0</td>'; } t+=`<td class="num"><b>${rowTot.get(r)}</b></td></tr>`; }
  t+=`</tbody></table></div><div class="statnote">Unité : ${child?'enfant':'dossier'}. Pourcentages calculés par ligne. Touchez une case pour voir les dossiers.</div><div class="xlist"></div>`;
  return t;
}

function statsHTML(F){
  BAR=new Map(); barSeq=0; HIST={};
  if(!F.length) return '<div class="card empty" style="margin-top:12px">Aucun dossier ne correspond à ces critères.</div>';
  const births=F.filter(isBirth), arch=F.filter(p=>p.status==='archived');
  const women=new Set(F.map(p=>idKey(p)||p.groupId||p.id)).size;
  const terms=births.map(termeN).filter(x=>x!=null);
  const kids=births.flatMap(p=>kidsOf(p).map(k=>({p,k})));
  const w=kids.map(x=>({v:numv(x.k.poids),p:x.p,k:x.k})).filter(x=>x.v>0);
  const phs=kids.map(x=>({v:numv(x.k.ph),p:x.p,k:x.k})).filter(x=>x.v!=null&&x.v>6&&x.v<8);
  const las=kids.map(x=>({v:numv(x.k.lact),p:x.p,k:x.k})).filter(x=>x.v!=null&&x.v>=0);
  const a5=kids.map(x=>numv(x.k.apg5)).filter(x=>x!=null);
  const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const ces=births.filter(p=>/Césarienne/.test(p.issue.type)).length, inst=births.filter(p=>p.issue.type==='Voie basse instrumentale').length;
  const an=births.filter(p=>p.issue.analgesie), peri=an.filter(p=>p.issue.analgesie==='Péridurale').length;
  const tr=births.filter(p=>p.issue.travail), decl=tr.filter(p=>p.issue.travail==='Déclenchement').length;
  const tile=(v,l)=>`<div class="tile"><b class="num">${v}</b><span>${l}</span></div>`;
  let h=`<div class="tiles">${tile(F.length,'dossiers')}${tile(women,'patientes distinctes')}${tile(F.length-arch.length,'grossesses en cours')}${tile(births.length,'accouchements')}${tile(births.length?pct(ces,births.length):'—','césariennes')}${tile(births.length?pct(inst,births.length):'—','extractions instrumentales')}${tile(tr.length?pct(decl,tr.length):'—','déclenchements'+(tr.length?' (sur '+tr.length+')':''))}${tile(an.length?pct(peri,an.length):'—','péridurales'+(an.length?' (sur '+an.length+')':''))}${tile(w.length?frn(Math.round(mean(w.map(x=>x.v))),0)+' g':'—','poids moyen'+(w.length?' (n = '+w.length+')':''))}${tile(terms.length?sa(Math.round(mean(terms))):'—','terme moyen')}${tile(terms.length?pct(terms.filter(t=>t<259).length,terms.length):'—','prématurité (< 37 SA)')}${tile(phs.length?pct(phs.filter(x=>x.v<7.1).length,phs.length):'—','pH < 7,10'+(phs.length?' (sur '+phs.length+')':''))}${tile(a5.length?pct(a5.filter(x=>x<7).length,a5.length):'—','Apgar 5 min < 7'+(a5.length?' (sur '+a5.length+')':''))}</div>`;
  h+=`<p class="note">Touchez une ligne, une barre ou une case pour afficher les dossiers concernés et les ouvrir.</p>`;
  const per=PERIODS[A.period].toLowerCase();
  const mm=new Map(); for(const p of F){ const d=perDate(p,A.period); if(d==null) continue; const x=new Date(d); const k=Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),1); const e=mm.get(k)||{n:0,ids:[]}; e.n++; e.ids.push(p.id); mm.set(k,e); }
  const mt=[...mm.entries()].sort((a,b)=>a[0]-b[0]);
  if(mt.length && mt.length<=36){ const mf=new Intl.DateTimeFormat('fr-FR',{month:'short',year:'numeric',timeZone:'UTC'}); h+=`<section class="sec"><div class="card">${bars(`Dossiers par mois (${per})`,mt.map(([d,e])=>[mf.format(d),e.n,e.ids]),0,null,true)}</div></section>`; }
  const mkEdges=(lo,hi,step)=>{ const e=[]; for(let x=lo;x<=hi+1e-9;x=Math.round((x+step)*1000)/1000) e.push(x); return e; };
  if(w.length){ const lo=Math.floor(Math.min(...w.map(x=>x.v))/250)*250, hi=Math.ceil((Math.max(...w.map(x=>x.v))+1)/250)*250; const step=(hi-lo)/250>24?500:250;
    HIST.poids={title:'Répartition des poids de naissance',unit:'grammes',vals:w,edges:mkEdges(lo,Math.max(hi,lo+step),step),fmt:x=>frn(Math.round(x),0)+' g',tick:x=>frn(x,0)}; h+=histHTML('poids'); }
  if(phs.length){ const lo=Math.floor(Math.min(...phs.map(x=>x.v))*20)/20, hi=Math.ceil((Math.max(...phs.map(x=>x.v))+0.001)*20)/20;
    HIST.ph={title:'Répartition du pH au cordon',unit:'pH',vals:phs,edges:mkEdges(lo,Math.max(hi,lo+0.05),0.05),fmt:x=>frn(x,2),tick:x=>frn(x,2)}; h+=histHTML('ph'); }
  if(las.length){ const hi=Math.ceil(Math.max(...las.map(x=>x.v))+0.001);
    HIST.lact={title:'Répartition des lactates au cordon',unit:'mmol/L',vals:las,edges:mkEdges(0,Math.max(hi,1),1),fmt:x=>frn(x)+' mmol/L',tick:x=>frn(x,0)}; h+=histHTML('lact'); }
  // Croisements
  const opt=sel=>[...new Set(DIMS.map(d=>d.g))].map(g=>`<optgroup label="${esc(g)}">${DIMS.filter(d=>d.g===g).map(d=>`<option value="${d.k}" ${sel===d.k?'selected':''}>${esc(d.l)}</option>`).join('')}</optgroup>`).join('');
  const presets=[['decl|poids','Déclenchement × poids'],['crois|poids','Croissance estimée × poids'],['rcf|apg5','Motif RCF × Apgar 5 min'],['rcf|ph','Motif RCF × pH'],['mode|ph','Mode × pH'],['mode|apg5','Mode × Apgar 5 min'],['decl|mode','Déclenchement × mode'],['code|delai','Code × délai'],['cesU|code','Motif en travail × code']];
  h+=`<section class="sec"><h2>Croisements</h2><div class="card"><div class="fpad"><div class="seg" style="margin-top:6px">${presets.map(([v,l])=>`<button type="button" class="btn small" data-xp="${v}">${l}</button>`).join('')}</div>
    <div class="grid2" style="margin-top:10px"><label class="f" style="margin-top:0"><span>Lignes</span><select id="xr" class="xsel">${opt(A.xr)}</select></label><label class="f" style="margin-top:0"><span>Colonnes</span><select id="xc" class="xsel">${opt(A.xc)}</select></label></div></div>
    <div id="xtab" class="fpad">${crossHTML(F)}</div></div></section>`;
  // Barres par rubrique
  for(const g of [...new Set(DIMS.map(d=>d.g))]){
    const inner=DIMS.filter(d=>d.g===g&&d.k!=='flags'||d.g===g&&d.k==='flags').map(d=>dimBars(d,F)).join('');
    if(inner) h+=`<section class="sec"><details class="sgrp" ${g==='Accouchement'||g==='Nouveau-né'?'open':''}><summary>${esc(g)}</summary><div class="card">${inner}</div></details></section>`;
  }
  h+=`<p class="note">Les pourcentages sont calculés sur les dossiers (ou les enfants) où l’information est renseignée ; les données manquantes ne sont pas comptées.</p>`;
  return h;
}
/* ---------- Agenda ---------- */
function renderAgenda(){
  const v=$('#view'); const t=today(), N=S.agendaDays;
  const late=[], open=[], soon=[];
  for(const p of S.patients){
    if(p.status && p.status!=='active') continue;
    const inf=info(p); if(!inf.ok) continue;
    for(const it0 of milestonesFor(p,inf)){
      if(it0.st==='fait') continue;
      const it=it0.rdv!=null?Object.assign({},it0,{s:it0.rdv,e:it0.rdv,name:it0.name+' – RDV'+(it0.time?' à '+it0.time:'')}):it0;
      const row={p,it};
      if(it.kind==='dpa'){ if(it.s>=t && it.s<=t+N*DAY) soon.push(row); continue; }
      if(it.e<t){ if(it.e>=t-30*DAY) late.push(row); }
      else if(it.s<=t) open.push(row);
      else if(it.s<=t+N*DAY) soon.push(row);
    }
  }
  late.sort((a,b)=>b.it.e-a.it.e); open.sort((a,b)=>a.it.e-b.it.e); soon.sort((a,b)=>a.it.s-b.it.s);
  const item=(r,mode)=>{ const it=r.it; let when;
    if(mode==='late') when=`<small style="color:var(--bad)">fenêtre close le ${fds(it.e)}</small>`;
    else if(mode==='open'){ const d=Math.round((it.e-t)/DAY); when=`<small style="color:${d<=7?'var(--warn)':'var(--accent)'}">${it.e===it.s?'aujourd’hui':d===0?'dernier jour':'jusqu’au '+fds(it.e)+' ('+d+' j)'}</small>`; }
    else when=`<small style="color:var(--muted)">${fDl.format(it.s)}</small>`;
    const can=it.kind!=='dpa';
    return `<div class="ms">${can?`<button class="chk" data-ag="${esc(r.p.id)}|${esc(it.id)}" aria-pressed="false" aria-label="Marquer comme fait : ${esc(it.name)}"></button>`:'<span class="chk" aria-hidden="true" style="border-style:dashed"></span>'}<div class="mn"><b>${esc(it.name)}</b><button class="link" style="padding:0" data-open="${esc(r.p.id)}">${esc(fullName(r.p))}</button></div><div class="md num">${when}</div></div>`; };
  const sec=(title,arr,mode,emptyMsg)=>`<section class="sec"><h2>${title} <span class="num" style="color:var(--muted);font-weight:400">${arr.length}</span></h2><div class="card">${arr.length?arr.map(r=>item(r,mode)).join(''):`<div class="txt" style="color:var(--muted)">${emptyMsg}</div>`}</div></section>`;
  let h=`<div class="summary"><strong>Agenda</strong>Examens et rendez-vous des grossesses en cours</div>`;
  h+=`<div class="seg" role="radiogroup" aria-label="Horizon">${[7,14,30,60].map(n=>`<label><input type="radio" name="hz" value="${n}" ${n===N?'checked':''}><span>${n} jours</span></label>`).join('')}</div>`;
  h+=sec('Fenêtre en cours',open,'open','Aucun examen dont la fenêtre est ouverte.');
  h+=sec(`À venir dans les ${N} jours`,soon,'soon','Rien de prévu sur cette période.');
  h+=sec('Fenêtre dépassée, non validée (30 derniers jours)',late,'late','Aucun oubli récent.');
  v.innerHTML=h;
  $$('input[name="hz"]').forEach(r=>r.addEventListener('change',e=>{ S.agendaDays=+e.target.value; renderAgenda(); }));
  bindRows(v);
  $$('[data-ag]').forEach(b=>b.addEventListener('click',async()=>{ const [pid,mid]=b.dataset.ag.split('|'); const p=S.patients.find(x=>x.id===pid); p.done=p.done||{}; p.done[mid]=iso(today()); await savePatient(p); toast('Marqué comme fait'); renderAgenda(); }));
}

/* ---------- Fichiers : export / import ---------- */
async function saveFile(name,data){
  const type=name.endsWith('.json')?'application/json':name.endsWith('.csv')?'text/csv':name.endsWith('.pdf')?'application/pdf':'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return true; }
  }catch(e){ if(e && e.name==='AbortError') return false; }
  try{
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000); return true;
  }catch(e){ toast('Enregistrement impossible sur cet appareil'); return false; }
}
async function exportBackup(){
  toast('Préparation de la sauvegarde…');
  const files=(await getAll('files')).map(f=>({id:f.id,patientId:f.patientId,cat:f.cat||'',name:f.name,type:f.type,size:f.size,addedAt:f.addedAt,b64:b64(f.data)}));
  const payload={app:'suivi-grossesse',version:1,exportedAt:new Date().toISOString(),settings:S.settings,patients:S.patients,files};
  const ok=await saveFile(`sauvegarde-suivi-grossesse-${iso(today())}.json`, new Blob([JSON.stringify(payload)],{type:'application/json'}));
  if(ok){ toast('Sauvegarde exportée'); try{ await put('kv',Date.now(),'lastBackup'); S.lastBackup=Date.now(); }catch(e){} }
}
async function importBackup(file){
  if(!file) return;
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast('Fichier illisible : choisissez une sauvegarde .json de l’application'); return; }
  if(!data || data.app!=='suivi-grossesse' || !Array.isArray(data.patients)){ toast('Ce fichier n’est pas une sauvegarde de l’application'); return; }
  const nf=(data.files||[]).length;
  if(!await ask({title:'Remplacer les données actuelles ?',body:`La sauvegarde contient ${data.patients.length} dossier(s) et ${nf} document(s). Les données présentes sur cet appareil seront remplacées.`,ok:'Importer'})) return;
  try{
    await clearAll();
    S.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),data.settings||{}); await saveSettings();
    for(const p of data.patients) await put('patients',p);
    for(const f of (data.files||[])) await put('files',{id:f.id,patientId:f.patientId,cat:f.cat||'',name:f.name,type:f.type,size:f.size,addedAt:f.addedAt,data:unb64(f.b64)});
    S.patients=await getAll('patients'); toast('Sauvegarde importée'); go('liste');
  }catch(e){ toast('Import interrompu : espace de stockage insuffisant ?'); S.patients=await getAll('patients'); }
}

  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const lines=[cols.map(q).join(';')];
  for(const p of arr){ const i=info(p), o=p.issue||{}, d=parseD(o.date), k=list(o.enfants), j=f=>k.map(e=>e[f]||'').join(' / '); const lp=lastField(p,'presentation'), lc=lastField(p,'pct'); const b=imc(p);
    lines.push([p.nom,p.prenom,p.naissance,p.ddr||'',i.ok?iso(i.base+14*DAY):'',i.ok?iso(i.dpa):'',p.gestite,p.parite,p.cesariennes,p.groupe,p.rhesus,b!=null?frn(b):'',p.allergies,p.tabac,p.alcool,(p.toxiques||'')+(p.toxPrec?' – '+p.toxPrec:''),(lastField(p,'poidsM')||{}).v||'',(()=>{ const x=lastField(p,'pas'); return x?x.v+'/'+(x.ev.pad||''):''; })(),sexfArr(p).map(x=>SEXF[x]||'').join(' / '),p.avisRef?'Oui'+(p.avisRefMotif?' – '+p.avisRefMotif:''):'',list(p.hospits).map(h=>(h.debut||'')+' '+(h.motif||'')).join(' ; '),lp?lp.v:'',lc?croisCat(lc.v):'',lieuLabel(p),p.planned&&p.planned.type?p.planned.type+(planMotifs(p.planned).length?' – '+planMotifs(p.planned).join(', '):''):'',p.planned&&p.planned.date||'',(p.status==='archived'?'Archivée':'En cours'),o.type,o.date,d!=null&&i.ok?sa(Math.round((d-i.base)/DAY)):'',lieuLabel(o),o.travail,list(o.declMotifs).join(', '),list(o.cesMotifs).join(', '),o.code,o.delai,o.instrument,list(o.instrMotifs).join(', '),o.analgesie,o.perinee,o.delivrance,o.hdd,k.map(e=>SEXE[e.sexe]||'').join(' / '),j('poids'),j('ph'),j('lact'),j('apg1'),j('apg5'),j('apg10'),o.alim,list(p.pathoMat).join(', '),list(p.pathoFoet).join(', '),complMat(p).join(', '),list(o.complNeo).join(', '),[...list(p.ttFond),...list(p.ttGross)].map(t=>t.nom).join(', '),list(p.corr).map(c=>c.role+' : '+c.nom).join(' ; ')].map(q).join(';')); }
  if(await saveFile(`patientes-${iso(today())}.csv`,'\uFEFF'+lines.join('\r\n'))) toast(arr.length+' dossier'+(arr.length>1?'s exportés':' exporté'));
}

/* ---------- Boîte de dialogue ---------- */
function choose({title,body,buttons}){
  return new Promise(res=>{
    const m=$('#modal'), b=$('#modalBox');
    b.innerHTML=`<h3>${esc(title)}</h3><p>${esc(body||'')}</p><div class="bx" style="flex-direction:column;align-items:stretch">${buttons.map(([v,l,c])=>`<button class="btn ${c}" data-v="${v}" style="justify-content:center">${esc(l)}</button>`).join('')}</div>`;
    m.classList.add('open'); b.querySelector('[data-v]').focus();
    const done=v=>{ m.classList.remove('open'); m.onclick=null; document.removeEventListener('keydown',key); res(v); };
    const key=e=>{ if(e.key==='Escape') done('cancel'); };
    document.addEventListener('keydown',key);
    m.onclick=e=>{ const a=e.target.closest('[data-v]'); if(a) done(a.dataset.v); else if(e.target===m) done('cancel'); };
  });
}
function ask({title,body,ok='Confirmer',danger=false}){
  return new Promise(res=>{
    const m=$('#modal'), b=$('#modalBox');
    b.innerHTML=`<h3>${esc(title)}</h3><p>${esc(body||'')}</p><div class="bx"><button class="btn" data-a="0">Annuler</button><button class="btn ${danger?'danger':'primary'}" data-a="1">${esc(ok)}</button></div>`;
    m.classList.add('open'); b.querySelector('[data-a="1"]').focus();
    const done=v=>{ m.classList.remove('open'); m.onclick=null; document.removeEventListener('keydown',key); res(v); };
    const key=e=>{ if(e.key==='Escape') done(false); };
    document.addEventListener('keydown',key);
    m.onclick=e=>{ const a=e.target.closest('[data-a]'); if(a) done(a.dataset.a==='1'); else if(e.target===m) done(false); };
  });
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#viewer').classList.contains('open')) $('#vClose').click(); });

/* ---------- Démarrage ---------- */
(async function init(){
  $('#view').innerHTML='<div class="card empty" style="margin-top:16px">Chargement des dossiers…</div>';
  idb=await openDB();
  if(false){ MODE='cloud'; const n=await migrateLocalToCloud(); if(n) setTimeout(()=>toast(n+' dossier'+(n>1?'s':'')+' de l’appareil copié'+(n>1?'s':'')+' dans votre compte'),600); }
  else MODE=idb?'local':'memory';
  try{ S.lastBackup=(idb && await rq(store('kv').get('lastBackup')))||null; }catch(e){}
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  try{ const s=await get('kv','settings'); S.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),s||{}); }catch(e){ S.settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); }
  if(S.settings.termDays!==287){ S.settings.termDays=287; await saveSettings(); }
  if((S.settings.msVersion||1)<MS_VERSION){
    const have=new Set(S.settings.milestones.map(m=>m.id));
    DEFAULT_MS.filter(m=>m.id.startsWith('cm') && !have.has(m.id)).forEach(m=>S.settings.milestones.push(Object.assign({},m)));
    if((S.settings.msVersion||1)<6){ S.settings.milestones.forEach(m=>{ if(m.id==='cm6'){ if(m.e===202) m.e=195; if(m.ideal===196) m.ideal=189; } }); }
    if((S.settings.msVersion||1)<5){ S.settings.milestones.forEach(m=>{ if(IDEAL_IDS[m.id]!=null && m.ideal==null) m.ideal=IDEAL_IDS[m.id]; }); }
    if((S.settings.msVersion||1)<4){ S.settings.milestones=S.settings.milestones.filter(m=>m.id!=='vrs'); S.settings.milestones.forEach(m=>{ if(AUTO_IDS[m.id] && !m.auto) m.auto=AUTO_IDS[m.id]; }); }
    if((S.settings.msVersion||1)<3) S.settings.milestones=S.settings.milestones.filter(m=>!['epp','post','lim42'].includes(m.id));
    S.settings.milestones.sort((a,b)=>a.s-b.s); S.settings.msVersion=MS_VERSION; await saveSettings();
  }
  try{ S.patients=await getAll('patients'); }catch(e){ S.patients=[]; }
  for(const p of S.patients){ let ch=false;
    if(p.lieu && !LIEUX.includes(p.lieu)){ p.lieuPrec=p.lieuPrec||p.lieu; p.lieu='Autre établissement'; ch=true; }
    if(p.issue && p.issue.lieu && !LIEUX.includes(p.issue.lieu)){ p.issue.lieuPrec=p.issue.lieuPrec||p.issue.lieu; p.issue.lieu='Autre établissement'; ch=true; }
    if(ch){ try{ await put('patients',p); }catch(e){} } }
  for(const p of S.patients){ if(p.status==='delivered'){ p.status='archived'; p.issue=Object.assign({type:p.accVoie||'',date:p.accDate||'',notes:p.accNotes||''},p.issue||{}); try{ await put('patients',p); }catch(e){} } }
  if(MODE==='local' && navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
  render();
})();
})();
