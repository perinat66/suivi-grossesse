function ppCard(o){
  const s=(k,opts,lab)=>`<label class="f"><span>${lab}</span><select data-pf="${k}"><option value=""></option>${opts.map(x=>Array.isArray(x)?`<option value="${esc(x[0])}" ${o[k]===x[0]?'selected':''}>${esc(x[1])}</option>`:`<option ${o[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
  const t=(k,lab,mode)=>`<label class="f"><span>${lab}</span><input data-pf="${k}" ${mode?`inputmode="${mode}"`:''} value="${esc(o[k]||'')}"></label>`;
  return `<div class="ppc"><div class="grid2">${t('annee','Année ou date')}${t('lieu','Lieu')}</div>
   <div class="grid2">${s('issue',[...ISSUE_GROUPS.flatMap(g=>g[1]),'Autre'],'Issue / mode')}${t('terme','Terme (ex. 39 SA + 2 j)')}</div>
   <div class="grid3">${s('presentation',['Céphalique','Siège','Transverse'],'Présentation')}${s('sexe',Object.entries(SEXE),'Sexe')}${t('poids','Poids (g)','numeric')}</div>
   <div class="grid2">${t('prenom','Prénom')}${s('anesth',ANALG,'Analgésie / anesthésie')}</div>
   <div class="grid2">${s('perinee',PERINEE,'Périnée')}${s('delivrance',PP_DELIV,'Délivrance')}</div>
   <div class="grid2">${s('grossesse',['Normale','Pathologique'],'Grossesse')}${t('grossessePrec','Précision')}</div>
   <div class="grid2">${s('suites',['Normales','Pathologiques'],'Suites de couches')}${t('suitesPrec','Précision')}</div>
   ${s('allaitement',ALIM,'Allaitement')}
   <button type="button" class="link" data-rmcard style="color:var(--bad);padding:6px 0 0">Retirer cette grossesse</button></div>`;
}
function sexfHTML(n,arr){ return Array.from({length:n},(_,i)=>`<label class="f"><span>${n>1?'Sexe du fœtus '+(i+1):'Sexe fœtal'}</span><select data-sf><option value="">Non connu</option>${Object.entries(SEXF).map(([k,l])=>`<option value="${k}" ${arr[i]===k?'selected':''}>${l}</option>`).join('')}</select></label>`).join(''); }
function openEditor(src,prefill){
  if(isPatient()) return;
  const isNew=!src;
  const p=src?JSON.parse(JSON.stringify(src)):Object.assign({id:uid('p'),createdAt:Date.now(),status:'active',datingMethod:'ddr',cycle:S.settings.cycle,gestite:'',parite:'',cesariennes:0,multiple:1,rhesus:'',groupe:'',pathoMat:[],pathoFoet:[],ttFond:[],ttGross:[],events:[],done:{}},prefill||{});
  const sh=$('#sheet');
  const otherM=list(p.pathoMat).filter(x=>!PATHO_MAT.includes(x)).join(', ');
  const otherF=list(p.pathoFoet).filter(x=>!PATHO_FOET.includes(x)).join(', ');
  sh.innerHTML=`<div class="sheet-h"><button class="btn ghost" id="cancel">Annuler</button><h2 id="sheetTitle">${isNew?'Nouvelle patiente':'Modifier la fiche'}</h2><button class="btn primary" id="save">Enregistrer</button></div>
  <div class="form">
   ${prefill?'<div class="banner">Identité, antécédents et traitements de fond repris du dossier précédent ; la grossesse précédente est ajoutée aux grossesses antérieures ; gestité, parité et césariennes mises à jour. Vérifiez-les.</div>':''}
   <div class="banner" id="matchHint" style="display:none"></div>
   <fieldset><legend>Identité</legend><div class="fbox">
    <div class="grid2">${F('Nom','<input name="nom" autocomplete="off" value="'+esc(p.nom||'')+'">')}${F('Prénom','<input name="prenom" autocomplete="off" value="'+esc(p.prenom||'')+'">')}</div>
    <div class="grid2">${F('Date de naissance','<input type="date" name="naissance" value="'+esc(p.naissance||'')+'">')}${F('Téléphone','<input type="tel" name="telephone" value="'+esc(p.telephone||'')+'">')}</div>
    ${F('E-mail','<input type="email" name="email" autocomplete="off" value="'+esc(p.email||'')+'">')}
    <div class="grid2">${F('Taille (cm)','<input name="taille" inputmode="numeric" value="'+esc(p.taille||'')+'">')}${F('Poids avant grossesse (kg)','<input name="poidsAvant" inputmode="decimal" value="'+esc(p.poidsAvant||'')+'">')}</div>
    <div class="preview num" id="imcPrev" style="display:none"></div>
    ${F('Allergies','<input name="allergies" value="'+esc(p.allergies||'')+'" placeholder="Aucune connue">')}
   </div></fieldset>

   <fieldset><legend>Datation</legend><div class="fbox">
    ${radios('datingMethod',[['ddr','DDR'],['dg','Début de grossesse'],['echo','Échographie'],['dpa','Terme connu']],p.datingMethod||'ddr')}
    <div data-m="ddr" class="grid2">${F('Date des dernières règles','<input type="date" name="ddr" value="'+esc(p.ddr||'')+'">')}${F('Durée du cycle (jours)','<input type="number" inputmode="numeric" min="20" max="45" name="cycle" value="'+esc(p.cycle||28)+'">')}</div>
    <div data-m="dg">${F('Date de début de grossesse (conception)','<input type="date" name="dg" value="'+esc(p.dg||'')+'">')}</div>
    <div data-m="echo"><div class="grid3">${F('Date de l’échographie','<input type="date" name="echoDate" value="'+esc(p.echoDate||'')+'">')}${F('Âge (SA)','<input type="number" inputmode="numeric" min="5" max="42" name="echoSA" value="'+esc(p.echoSA??'')+'">')}${F('+ jours','<input type="number" inputmode="numeric" min="0" max="6" name="echoJ" value="'+esc(p.echoJ??0)+'">')}</div></div>
    <div data-m="dpa">${F('Terme prévu d’accouchement (41 SA)','<input type="date" name="dpaManual" value="'+esc(p.dpaManual||'')+'">')}</div>
    <div class="preview num" id="prev"></div>
   </div></fieldset>

   <fieldset><legend>Grossesse actuelle</legend><div class="fbox">
    <div class="grid3">${F('Gestité','<input type="number" inputmode="numeric" min="1" name="gestite" value="'+esc(p.gestite??'')+'">')}${F('Parité','<input type="number" inputmode="numeric" min="0" name="parite" value="'+esc(p.parite??'')+'">')}${F('Césariennes','<input type="number" inputmode="numeric" min="0" name="cesariennes" value="'+esc(p.cesariennes??0)+'">')}</div>
    <label class="chkline"><input type="checkbox" name="uterusCicatriciel" ${p.uterusCicatriciel?'checked':''}> Autre cicatrice utérine (myomectomie, etc.)</label>
    <div class="f"><span>Nombre de fœtus</span>${radios('multiple',[['1','Unique'],['2','Gémellaire'],['3','Triple ou plus']],p.multiple||1)}</div>
    <div id="sexF" class="grid2">${sexfHTML(+p.multiple||1,sexfArr(p))}</div>
    <div class="grid2">${F('Groupe sanguin','<select name="groupe">'+['','A','B','AB','O'].map(g=>`<option ${p.groupe===g?'selected':''} value="${g}">${g||'—'}</option>`).join('')+'</select>')}${F('Rhésus','<select name="rhesus"><option value="">—</option><option value="+" '+(p.rhesus==='+'?'selected':'')+'>Positif</option><option value="-" '+(p.rhesus==='-'?'selected':'')+'>Négatif</option></select>')}</div>
    <div id="conjBox">${F('Rhésus D du conjoint','<select name="rhesusConj"><option value="" '+(!p.rhesusConj?'selected':'')+'>Inconnu</option><option value="+" '+(p.rhesusConj==='+'?'selected':'')+'>Positif</option><option value="-" '+(p.rhesusConj==='-'?'selected':'')+'>Négatif (carte de groupe vérifiée)</option></select>')}<div class="note" style="margin:6px 0 0">Conjoint RhD positif ou inconnu : génotypage RhD fœtal sur sang maternel dès 11 SA, contrôle si négatif ou indéterminé.</div></div>
    <label class="chkline"><input type="checkbox" name="dgRisk" ${p.dgRisk?'checked':''}> Facteurs de risque de diabète gestationnel (programme l’HGPO)</label>
    <details class="dginfo"><summary>Rappel des critères de dépistage</summary><ul>${DG_CRITERIA.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><p>Un seul critère suffit à proposer le dépistage.</p></details>
    <div class="preview" id="dgHint" style="display:none"></div>
    <label class="chkline"><input type="checkbox" name="avisRef" ${p.avisRef?'checked':''}> Avis échographique de référence</label>
    <div id="avisBox">${F('Motif de l’avis de référence','<input name="avisRefMotif" value="'+esc(p.avisRefMotif||'')+'">')}</div>
   </div></fieldset>

   <fieldset><legend>Antécédents</legend><div class="fbox">
    ${F('Médicaux','<textarea name="atcdMed">'+esc(p.atcdMed||'')+'</textarea>')}
    ${F('Chirurgicaux','<textarea name="atcdChir">'+esc(p.atcdChir||'')+'</textarea>')}
    <div class="grid2">${F('Tabac','<select name="tabac">'+['','Non','Sevré avant la grossesse','Arrêté pendant la grossesse','Actif'].map(x=>`<option ${p.tabac===x?'selected':''} value="${esc(x)}">${x||'—'}</option>`).join('')+'</select>')}${F('Cigarettes par jour','<input name="tabacN" inputmode="numeric" value="'+esc(p.tabacN||'')+'">')}</div>
    <div class="grid2">${F('Alcool','<select name="alcool">'+['','Non','Arrêté pendant la grossesse','Occasionnel','Régulier'].map(x=>`<option ${p.alcool===x?'selected':''} value="${esc(x)}">${x||'—'}</option>`).join('')+'</select>')}${F('Toxiques','<select name="toxiques">'+['','Non','Arrêté pendant la grossesse','Actif'].map(x=>`<option ${p.toxiques===x?'selected':''} value="${esc(x)}">${x||'—'}</option>`).join('')+'</select>')}</div>
    ${F('Précisions (produits, quantités…)','<input name="toxPrec" value="'+esc(p.toxPrec||'')+'">')}
    ${F('Obstétricaux (précisions libres)','<textarea name="atcdObst">'+esc(p.atcdObst||'')+'</textarea>')}
   </div></fieldset>

   <fieldset><legend>Grossesses antérieures (détail)</legend><div class="fbox">
    <div id="pp">${list(p.prevPreg).map(ppCard).join('')}</div>
    <button type="button" class="btn small" id="addPP" style="margin-top:10px">＋ Ajouter une grossesse antérieure</button>
   </div></fieldset>

   <fieldset><legend>Traitements</legend><div class="fbox">
    <div class="f"><span>Traitements de fond</span><div id="ttF">${list(p.ttFond).map(t=>ttRow(t,false)).join('')}</div><button type="button" class="btn small" id="addTF" style="margin-top:8px">＋ Ajouter</button></div>
    <div class="f"><span>Instaurés pendant la grossesse</span><div id="ttG">${list(p.ttGross).map(t=>ttRow(t,true)).join('')}</div><button type="button" class="btn small" id="addTG" style="margin-top:8px">＋ Ajouter</button></div>
   </div></fieldset>

   <fieldset><legend>Pathologies de la grossesse</legend><div class="fbox">
    <div class="f"><span>Maternelles</span>${chips('pm',PATHO_MAT,list(p.pathoMat))}</div>
    ${F('Autres pathologies maternelles (séparées par des virgules)','<input name="pmOther" value="'+esc(otherM)+'">')}
    <div class="f"><span>Fœtales et annexielles</span>${chips('pf',PATHO_FOET,list(p.pathoFoet))}</div>
    ${F('Autres pathologies fœtales (séparées par des virgules)','<input name="pfOther" value="'+esc(otherF)+'">')}
    ${F('Précisions','<textarea name="pathoNotes">'+esc(p.pathoNotes||'')+'</textarea>')}
   </div></fieldset>

   <fieldset><legend>Accouchement prévu</legend><div class="fbox">
    <div class="f"><span>Lieu prévu</span>${radios('lieu',LIEUX.map(x=>[x,x]),p.lieu||'')}</div>
    ${F('Précision (autre établissement)','<input name="lieuPrec" value="'+esc(p.lieuPrec||'')+'">')}
    ${F('Type de maternité','<select name="niveau">'+['','I','IIA','IIB','III'].map(n=>`<option ${p.niveau===n?'selected':''} value="${n}">${n||'—'}</option>`).join('')+'</select>')}
   </div></fieldset>

   <fieldset><legend>Correspondants</legend><div class="fbox">
    <div id="corr">${(p.corr||[{role:'Sage-femme'},{role:'Gynécologue-obstétricien'},{role:'Médecin traitant'}]).map(corrRow).join('')}</div>
    <button type="button" class="btn small" id="addCorr" style="margin-top:8px">＋ Ajouter un correspondant</button>
   </div></fieldset>

   <fieldset><legend>Notes</legend><div class="fbox">${F('Notes (transmissibles à la patiente)','<textarea name="notes">'+esc(p.notes||'')+'</textarea>')}${F('🔒 Notes privées (jamais transmises à la patiente)','<textarea name="notesPriv">'+esc(p.notesPriv||'')+'</textarea>')}</div></fieldset>
  </div>`;
  sh.classList.add('open'); document.body.style.overflow='hidden'; sh.scrollTop=0;
  const val=n=>{ const el=sh.querySelector(`[name="${n}"]`); if(!el) return ''; if(el.type==='checkbox') return el.checked; if(el.type==='radio'){ const c=sh.querySelector(`[name="${n}"]:checked`); return c?c.value:''; } return el.value.trim(); };
  let lastMult=+p.multiple||1;
  const sync=()=>{
    const m=val('datingMethod'); $$('[data-m]',sh).forEach(d=>d.style.display=d.dataset.m===m?'':'none');
    const tmp={datingMethod:m,ddr:val('ddr'),cycle:val('cycle'),dg:val('dg'),echoDate:val('echoDate'),echoSA:val('echoSA'),echoJ:val('echoJ'),dpaManual:val('dpaManual')};
    const inf=info(tmp); $('#prev').textContent = inf.ok ? `Aujourd’hui : ${sa(inf.ga)} – terme prévu le ${fd(inf.dpa)}` : 'Renseignez la date pour calculer le terme.';
    const tp={taille:val('taille'),poidsAvant:val('poidsAvant'),naissance:val('naissance')}; const b=imc(tp); const ip=$('#imcPrev'); ip.style.display=b!=null?'':'none'; ip.textContent=b!=null?'IMC avant grossesse : '+frn(b):'';
    const auto=dgAuto(tp); const dh=$('#dgHint'); dh.style.display=auto.length?'':'none'; dh.textContent=auto.length?'Critère présent d’après la fiche : '+auto.join(' ; ')+'.':'';
    $('#avisBox').style.display=val('avisRef')?'':'none'; $('#conjBox').style.display=val('rhesus')==='-'?'':'none';
    const mu=+val('multiple')||1; if(mu!==lastMult){ const cur=$$('[data-sf]',sh).map(s=>s.value); $('#sexF').innerHTML=sexfHTML(mu,cur); lastMult=mu; }
    const mh=$('#matchHint');
    if(isNew && !prefill){ const k=idKey({nom:val('nom'),prenom:val('prenom'),naissance:val('naissance')}); const prev=k?S.patients.filter(x=>idKey(x)===k).sort((a,b)=>pDate(b)-pDate(a))[0]:null;
      if(prev){ mh.style.display=''; mh.innerHTML=`Un dossier existe déjà pour cette patiente (${esc(pregLabel(prev))}). <button type="button" class="link" id="usePrev">Reprendre ses antécédents</button>`; $('#usePrev').onclick=()=>{ close(); openEditor(null,prefillFrom(prev)); }; }
      else mh.style.display='none'; }
  };
  const close=()=>{ sh.classList.remove('open'); sh.innerHTML=''; sh.oninput=sh.onchange=sh.onclick=null; document.body.style.overflow=''; };
  sh.oninput=sync; sh.onchange=sync; sync();
  const addRow=(box,g)=>{ box.insertAdjacentHTML('beforeend',ttRow({},g)); box.lastElementChild.querySelector('input').focus(); };
  $('#addTF').addEventListener('click',()=>addRow($('#ttF'),false));
  $('#addTG').addEventListener('click',()=>addRow($('#ttG'),true));
  $('#addCorr').addEventListener('click',()=>{ $('#corr').insertAdjacentHTML('beforeend',corrRow({role:'Autre'})); $('#corr').lastElementChild.querySelector('input').focus(); });
  $('#addPP').addEventListener('click',()=>{ $('#pp').insertAdjacentHTML('beforeend',ppCard({})); $('#pp').lastElementChild.querySelector('input').focus(); });
  sh.onclick=e=>{ const r=e.target.closest('[data-rm]'); if(r) r.parentElement.remove(); const c=e.target.closest('[data-rmcard]'); if(c) c.parentElement.remove(); };
  $('#cancel').addEventListener('click',close);
  let saving=false;
  $('#save').addEventListener('click',async()=>{
    if(saving) return;
    if(!val('nom') && !val('prenom')){ toast('Indiquez au moins un nom'); return; }
    if((p.status||'active')!=='archived'){
      const d=dupesOf({id:p.id,nom:val('nom'),prenom:val('prenom'),naissance:val('naissance'),status:'active'});
      if(d.length){ const x=d[0]; const i=info(x);
        const c=await choose({title:'Ce dossier existe peut-être déjà',body:`Une grossesse en cours est déjà enregistrée pour ${fullName(x)}${x.naissance?', née le '+fd(parseD(x.naissance)):''}${i.ok?' (terme prévu le '+fd(i.dpa)+')':''}.`,buttons:[['open','Ouvrir le dossier existant','primary'],['save',isNew?'Créer quand même':'Enregistrer quand même',''],['cancel','Annuler','']]});
        if(c==='open'){ close(); go('patient-'+x.id); return; }
        if(c!=='save') return; } }
    saving=true; $('#save').disabled=true;
    ['nom','prenom','naissance','telephone','email','rhesusConj','ddr','cycle','dg','echoDate','echoSA','echoJ','dpaManual','gestite','parite','cesariennes','groupe','rhesus','atcdMed','atcdChir','atcdObst','allergies','tabac','tabacN','alcool','toxiques','toxPrec','pathoNotes','lieu','lieuPrec','niveau','notes','notesPriv','avisRefMotif'].forEach(k=>p[k]=val(k));
    p.taille=nstr(val('taille')); p.poidsAvant=nstr(val('poidsAvant'));
    p.datingMethod=val('datingMethod')||'ddr'; p.multiple=+val('multiple')||1; p.status=p.status||'active';
    p.uterusCicatriciel=val('uterusCicatriciel'); p.dgRisk=val('dgRisk'); p.avisRef=val('avisRef'); if(!p.avisRef) p.avisRefMotif='';
    p.sexeF=$$('[data-sf]',sh).map(s=>s.value);
    const split=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
    p.pathoMat=[...$$('[name="pm"]:checked',sh).map(c=>c.value),...split(val('pmOther'))];
    p.pathoFoet=[...$$('[name="pf"]:checked',sh).map(c=>c.value),...split(val('pfOther'))];
    const rows=(box,g)=>$$('.trow',box).map(r=>({nom:r.querySelector('[data-tn]').value.trim(),poso:r.querySelector('[data-tp]').value.trim(),debut:g?r.querySelector('[data-td]').value:undefined})).filter(t=>t.nom);
    p.corr=$$('#corr .trow',sh).map(r=>({role:r.querySelector('[data-cr]').value,nom:r.querySelector('[data-cn]').value.trim(),contact:r.querySelector('[data-cc]').value.trim()})).filter(c=>c.nom||c.contact);
    p.ttFond=rows($('#ttF'),false); p.ttGross=rows($('#ttG'),true);
    p.prevPreg=$$('#pp .ppc',sh).map(c=>{ const o={}; $$('[data-pf]',c).forEach(i=>o[i.dataset.pf]=i.value.trim()); if(o.poids) o.poids=nstr(o.poids); return o; }).filter(o=>Object.values(o).some(Boolean));
    await savePatient(p); close(); toast(isNew?'Patiente ajoutée':'Fiche enregistrée'); go('patient-'+p.id);
  });
  setTimeout(()=>{ const n=sh.querySelector('[name="nom"]'); if(isNew && n) n.focus(); },60);
}

/* ---------- Réglages ---------- */
function wd(d){ return d==null?['','']:[Math.floor(d/7), d%7]; }
function renderSettingsPatient(){
  const v=$('#view');
  v.innerHTML=`<div class="summary"><strong>Réglages</strong>Mon suivi de grossesse</div>
  <section class="sec"><h2>Mon dossier</h2><div class="card"><div class="txt">Vos données sont enregistrées uniquement sur ce téléphone. Pour mettre à jour votre dossier, ouvrez le nouveau fichier remis par votre soignant.</div></div>
  <div class="actions"><button class="btn primary" id="psImp">📥 Ouvrir un dossier reçu</button><button class="btn" id="psExp">Sauvegarder mes données</button><button class="btn" id="psRest">Restaurer une sauvegarde</button><button class="btn danger" id="psWipe">Tout effacer</button></div></section>`;
  $('#psImp').addEventListener('click',pickDossier); $('#psExp').addEventListener('click',exportBackup);
  $('#psRest').addEventListener('click',()=>{ const i=$('#importInput'); i.value=''; i.onchange=()=>importBackup(i.files[0]); i.click(); });
  $('#psWipe').addEventListener('click',async()=>{ if(!await ask({title:'Tout effacer ?',body:'Votre dossier sera supprimé de ce téléphone.',ok:'Tout effacer',danger:true})) return; await clearAll(); S.patients=[]; toast('Données effacées'); go('liste'); });
}
function renderSettings(){
  if(APP_ROLE==='patient') return renderSettingsPatient();
  const v=$('#view'); const st=S.settings;
  let h=`<div class="summary"><strong>Réglages</strong>Calendrier de suivi appliqué à toutes les patientes</div>`;
  h+=`<section class="sec"><h2>Calcul du terme</h2><div class="card"><div class="msedit"><div>Terme prévu fixé à <b>41 SA</b> (usage français).</div><div class="nums" style="margin-top:12px">Cycle par défaut <input type="number" id="defCycle" min="20" max="45" value="${st.cycle}" aria-label="Cycle par défaut"> jours</div><label class="chkline"><input type="checkbox" id="congeChk" ${st.conge?'checked':''}> Afficher l’estimation du congé maternité</label></div></div></section>`;
  h+=`<section class="sec"><h2>Examens et échéances <button class="link" id="addMs">＋ Ajouter</button></h2><div class="card" id="msEd">`;
  st.milestones.forEach((m,i)=>{ const [sw,sd]=wd(m.s), [ew,ed]=wd(m.e);
    h+=`<div class="msedit" data-i="${i}"><div style="display:flex;gap:8px"><input class="nmin" data-k="name" value="${esc(m.name)}" aria-label="Intitulé"><button class="x" data-rmms="${i}" aria-label="Supprimer ${esc(m.name)}">×</button></div>
    <div class="nums">De <input type="number" data-k="sw" value="${sw}" min="0" max="44" aria-label="Début, semaines">+<input type="number" data-k="sd" value="${sd}" min="0" max="6" aria-label="Début, jours"> à <input type="number" data-k="ew" value="${ew}" min="0" max="44" placeholder="—" aria-label="Fin, semaines">+<input type="number" data-k="ed" value="${ed}" min="0" max="6" placeholder="—" aria-label="Fin, jours"> SA</div>
    <div class="nums">Pour <select data-k="cond" aria-label="Concerne">${Object.entries(COND).map(([k,l])=>`<option value="${k}" ${m.cond===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="nums">Terme cible <input type="number" data-k="iw" value="${m.ideal!=null?Math.floor(m.ideal/7):''}" min="0" max="44" placeholder="—" aria-label="Terme cible, semaines">+<input type="number" data-k="id" value="${m.ideal!=null?m.ideal%7:''}" min="0" max="6" placeholder="—" aria-label="Terme cible, jours"> SA</div>
    <div class="nums">Validé par <select data-k="auto" aria-label="Validation automatique"><option value="">— (manuellement)</option><option value="consult" ${m.auto==='consult'?'selected':''}>une consultation</option><option value="echo" ${m.auto==='echo'?'selected':''}>une échographie</option></select></div></div>`; });

/* ---------- Fichiers : export / import ---------- */
async function saveFile(name,data){
  const type=name.endsWith('.json')?'application/json':name.endsWith('.csv')?'text/csv':name.endsWith('.pdf')?'application/pdf':name.endsWith('.png')?'image/png':'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return true; }
  }catch(e){ if(e && e.name==='AbortError') return false; }
  try{
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000); return true;
  }catch(e){ toast('Enregistrement impossible sur cet appareil'); return false; }
}
async function exportBackup(){
  toast('Préparation de la sauvegarde…');
  const files=(await getAll('files')).map(f=>({id:f.id,patientId:f.patientId,cat:f.cat||'',name:f.name,type:f.type,size:f.size,addedAt:f.addedAt,b64:b64(f.data)}));
  const payload={app:'suivi-grossesse',version:1,exportedAt:new Date().toISOString(),settings:S.settings,patients:S.patients,files};
  const ok=await saveFile(`sauvegarde-suivi-grossesse-${iso(today())}.json`, new Blob([JSON.stringify(payload)],{type:'application/json'}));
  if(ok){ toast('Sauvegarde exportée'); try{ await put('kv',Date.now(),'lastBackup'); S.lastBackup=Date.now(); }catch(e){} }
}
async function importBackup(file){
  if(!file) return;
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast('Fichier illisible : choisissez une sauvegarde .json de l’application'); return; }
  if(!data || data.app!=='suivi-grossesse' || !Array.isArray(data.patients)){ toast('Ce fichier n’est pas une sauvegarde de l’application'); return; }
  const nf=(data.files||[]).length;
  if(!await ask({title:'Remplacer les données actuelles ?',body:`La sauvegarde contient ${data.patients.length} dossier(s) et ${nf} document(s). Les données présentes sur cet appareil seront remplacées.`,ok:'Importer'})) return;
  try{
    await clearAll();
    S.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),data.settings||{}); await saveSettings();
    for(const p of data.patients) await put('patients',p);
    for(const f of (data.files||[])) await put('files',{id:f.id,patientId:f.patientId,cat:f.cat||'',name:f.name,type:f.type,size:f.size,addedAt:f.addedAt,data:unb64(f.b64)});
    S.patients=await getAll('patients'); toast('Sauvegarde importée'); go('liste');
  }catch(e){ toast('Import interrompu : espace de stockage insuffisant ?'); S.patients=await getAll('patients'); }
}

/* ---------- Boîte de dialogue ---------- */
function choose({title,body,buttons}){
  return new Promise(res=>{
    const m=$('#modal'), b=$('#modalBox');
    b.innerHTML=`<h3>${esc(title)}</h3><p>${esc(body||'')}</p><div class="bx" style="flex-direction:column;align-items:stretch">${buttons.map(([v,l,c])=>`<button class="btn ${c}" data-v="${v}" style="justify-content:center">${esc(l)}</button>`).join('')}</div>`;
    m.classList.add('open'); b.querySelector('[data-v]').focus();
    const done=v=>{ m.classList.remove('open'); m.onclick=null; document.removeEventListener('keydown',key); res(v); };
    const key=e=>{ if(e.key==='Escape') done('cancel'); };
    document.addEventListener('keydown',key);
    m.onclick=e=>{ const a=e.target.closest('[data-v]'); if(a) done(a.dataset.v); else if(e.target===m) done('cancel'); };
  });
}
function ask({title,body,ok='Confirmer',danger=false}){
  return new Promise(res=>{
    const m=$('#modal'), b=$('#modalBox');
    b.innerHTML=`<h3>${esc(title)}</h3><p>${esc(body||'')}</p><div class="bx"><button class="btn" data-a="0">Annuler</button><button class="btn ${danger?'danger':'primary'}" data-a="1">${esc(ok)}</button></div>`;
    m.classList.add('open'); b.querySelector('[data-a="1"]').focus();
    const done=v=>{ m.classList.remove('open'); m.onclick=null; document.removeEventListener('keydown',key); res(v); };
    const key=e=>{ if(e.key==='Escape') done(false); };
    document.addEventListener('keydown',key);
    m.onclick=e=>{ const a=e.target.closest('[data-a]'); if(a) done(a.dataset.a==='1'); else if(e.target===m) done(false); };
  });
}

  for(const p of S.patients){ let ch=false;
    if(p.lieu && !LIEUX.includes(p.lieu)){ p.lieuPrec=p.lieuPrec||p.lieu; p.lieu='Autre établissement'; ch=true; }
    if(p.issue && p.issue.lieu && !LIEUX.includes(p.issue.lieu)){ p.issue.lieuPrec=p.issue.lieuPrec||p.issue.lieu; p.issue.lieu='Autre établissement'; ch=true; }
    if(ch){ try{ await put('patients',p); }catch(e){} } }
  for(const p of S.patients){ if(p.status==='delivered'){ p.status='archived'; p.issue=Object.assign({type:p.accVoie||'',date:p.accDate||'',notes:p.accNotes||''},p.issue||{}); try{ await put('patients',p); }catch(e){} } }
  if(MODE==='local' && navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
  render();
})();
})();
</script>
</body>
