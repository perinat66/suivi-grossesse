<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de grossesse</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Suivi grossesse">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E8ECF0; --ink:#17212B; --muted:#5B6876; --line:#D8DEE4;
  --accent:#7A2E63; --accent-ink:#FFFFFF; --accent-soft:#F4E7F0;
  --ok:#2E7656; --ok-soft:#E2F1E9; --term:#1E6A96; --warn:#935600; --warn-soft:#FBEFD8; --bad:#B42318; --bad-soft:#FBE6E3;
  --radius:14px;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#18202A; --surface-2:#232D38; --ink:#E7ECF1; --muted:#9BA8B5; --line:#2D3844;
    --accent:#DA8EC4; --accent-ink:#2A0F22; --accent-soft:#3A2335; --term:#7CC4EA;
    --ok:#6CC59A; --ok-soft:#163528; --warn:#E9B24E; --warn-soft:#3A2B12; --bad:#F28B82; --bad-soft:#3C1C1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#18202A; --surface-2:#232D38; --ink:#E7ECF1; --muted:#9BA8B5; --line:#2D3844;
  --accent:#DA8EC4; --accent-ink:#2A0F22; --accent-soft:#3A2335; --term:#7CC4EA;
  --ok:#6CC59A; --ok-soft:#163528; --warn:#E9B24E; --warn-soft:#3A2B12; --bad:#F28B82; --bad-soft:#3C1C1A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 10px;max-width:760px;margin:0 auto}
.top-row{display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:1.15rem;flex:1;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;padding:8px 10px}
.btn.small{min-height:32px;padding:4px 12px;font-size:.9rem}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 8px;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* List */
.summary{margin:14px 2px 4px;color:var(--muted)}
.summary strong{color:var(--ink);font-size:1.6rem;display:block;line-height:1.15}
.search{display:flex;gap:8px;margin:12px 0 4px}
.search input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.search select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px}
.group{margin-top:18px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 6px}
.group-h h2{font-size:1.02rem;margin:0}
.group-h h2 span{color:var(--muted);font-weight:400}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:4px}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden}
.row{display:flex;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;align-items:flex-start;border-top:1px solid var(--line)}
.card > .row:first-child{border-top:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:#fff;background:var(--c)}
.rmain{flex:1;min-width:0}
.nm{font-weight:700;display:block}
.trio{display:grid;grid-template-columns:repeat(3,auto);gap:2px 14px;justify-content:start;margin-top:2px}
.trio small{display:block;color:var(--muted);font-size:.75rem}
.trio span{font-size:.92rem}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.prog{display:block;height:4px;background:var(--surface-2);border-radius:4px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.prog.over i{background:var(--bad)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* Detail */
.back{margin:8px 0 0}
.hero{background:var(--surface);border-radius:var(--radius);padding:18px 16px;margin-top:10px}
.hero h1{margin:0;font-size:1.6rem;line-height:1.15}
.hero .sub{color:var(--muted);margin-top:4px}
.ga-big{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:14px}
.ga-big .v{font-size:2.3rem;font-weight:700;line-height:1}
.ga-big .l{color:var(--muted);font-size:.85rem}
.ruler{margin-top:16px}
.ruler svg{width:100%;height:auto;display:block}
.sec{margin-top:22px}
.sec > h2{font-size:1.02rem;margin:0 4px 8px;display:flex;justify-content:space-between;align-items:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.card > .kv:first-child{border-top:0}
.kv .k{color:var(--muted)}
.kv .v{text-align:right;font-weight:700}
.txt{padding:11px 14px;border-top:1px solid var(--line);white-space:pre-wrap}
.card > .txt:first-child{border-top:0}
.txt .k{display:block;color:var(--muted);font-size:.82rem}
.ms{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.card > .ms:first-child{border-top:0}
.ms .mn{flex:1;min-width:0}
.ms .mn b{display:block;font-weight:700}
.ms .mn small{color:var(--muted)}
.ms .md{text-align:right;font-size:.92rem}
.ms .md small{display:block}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.st-encours .chk{border-color:var(--accent)}
.st-depasse .chk{border-color:var(--bad)}
.st-fait .mn b{color:var(--muted);text-decoration:line-through}
.note{color:var(--muted);font-size:.85rem;margin:8px 4px 0}
.doc{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.card > .doc:first-child{border-top:0}
.doc .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;text-align:left;padding:0;font-weight:700;color:var(--accent)}
.doc small{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.inline-form{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.inline-form input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-width:0}

/* Sheet editor */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:block}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;margin:0;font-size:1.05rem;text-align:center}
.form{max-width:760px;margin:0 auto;padding:8px 16px 80px}
fieldset{border:0;margin:20px 0 0;padding:0}
legend{font-weight:700;font-size:1.02rem;padding:0 4px 8px}
.fbox{background:var(--surface);border-radius:var(--radius);padding:4px 14px 14px}
.f{display:block;margin-top:12px}
.f > span{display:block;font-size:.86rem;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.f textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.92rem;background:var(--bg)}
.seg input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.preview{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.trow{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin-top:8px;align-items:center}
.trow.g{grid-template-columns:1.3fr 1fr .9fr auto}
.trow input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-width:0;width:100%}
.x{border:0;background:var(--surface-2);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;padding:0}
.chkline{display:flex;gap:10px;align-items:center;margin-top:12px}
.chkline input{width:20px;height:20px;accent-color:var(--accent)}

/* Settings */
.msedit{padding:12px 14px;border-top:1px solid var(--line)}
.card > .msedit:first-child{border-top:0}
.msedit input,.msedit select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-width:0}
.msedit .nmin{width:100%}
.msedit .nums{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:.9rem;color:var(--muted)}
.msedit .nums input{width:58px;text-align:center}
.msedit .nums select{flex:1;min-width:140px}

/* Modal, toast, viewer */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.45);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--surface);border-radius:18px;padding:20px;max-width:420px;width:100%}
.modal h3{margin:0 0 8px}
.modal p{margin:0 0 12px;color:var(--muted)}
.modal .bx{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:50;font-weight:700;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
.viewer{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
.viewer.open{display:flex}
.viewer header{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.viewer header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vpages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--surface-2)}
.vpages canvas{display:block;margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:none}
.vpages .vmsg{text-align:center;color:var(--muted);padding:30px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--surface);border-radius:var(--radius);padding:12px 14px}
.tile b{display:block;font-size:1.45rem;line-height:1.15}
.tile span{color:var(--muted);font-size:.85rem}
.bars{padding:6px 14px 12px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(50px,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:.92rem}
.bar .bl{overflow:hidden;text-overflow:ellipsis}
.bar .bt{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .bv{text-align:right;white-space:nowrap;font-weight:700}
.bar .bv small{color:var(--muted);font-weight:400}
button.bar{border:0;background:none;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:8px}
button.bar:disabled{cursor:default}
button.bar[aria-expanded="true"] .bl{color:var(--accent);font-weight:700}
.barlist{margin:2px 0 10px;border:1px solid var(--line)}
.statnote{color:var(--muted);font-size:.82rem;padding:10px 14px 0}
details.flt{border-top:1px solid var(--line)}
details.flt summary{padding:11px 14px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;list-style:none}
details.flt summary::-webkit-details-marker{display:none}
details.flt summary::after{content:"＋";color:var(--muted)}
details.flt[open] summary::after{content:"−"}
details.flt summary small{color:var(--accent);font-weight:700;margin-left:auto;margin-right:10px}
details.flt .seg{padding:0 14px 12px;margin-top:0}
.fpad{padding:4px 14px 12px}
.fpad .grid2 input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg)}
.row.sel-on{background:var(--accent-soft)}
.selbox{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;margin-top:8px;color:#fff;font-weight:700;font-size:.85rem}
.row.sel-on .selbox{background:var(--accent);border-color:var(--accent)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.selbar b{flex:1;min-width:120px}
.kid{border:1px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin-top:10px;background:var(--bg)}
.kid-h{display:flex;justify-content:space-between;align-items:center;padding-top:8px}
.kid .f input,.kid .f select,.ppc .f input,.ppc .f select,.hrow .f input{background:var(--surface)}
.ppc,.hrow{border:1px solid var(--line);border-radius:12px;padding:2px 12px 10px;margin-top:10px;background:var(--bg)}
.fgrp{padding:14px 14px 4px;font-size:.78rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--line)}
.bblock{border-top:1px solid var(--line)} .card > .bblock:first-child{border-top:0}
.bblock h3{font-size:.95rem;margin:0;padding:12px 14px 0}
details.sgrp > summary{font-weight:700;font-size:1.02rem;padding:0 4px 8px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.sgrp > summary::-webkit-details-marker{display:none}
details.sgrp > summary::after{content:"＋";color:var(--muted)} details.sgrp[open] > summary::after{content:"−"}
.hwrap svg{width:100%;height:auto;display:block}
.hwrap{padding:4px 10px}
.hb{cursor:pointer}
.xwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.xt{border-collapse:collapse;font-size:.85rem;min-width:100%}
.xt th,.xt td{border:1px solid var(--line);padding:4px 6px;text-align:center;vertical-align:middle}
.xt thead th{background:var(--surface-2);font-weight:700;font-size:.78rem}
.xt tbody th{text-align:left;font-weight:700;background:var(--surface-2);font-size:.8rem;max-width:140px}
.xt td.z{color:var(--muted)}
.xc{border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:4px 6px;font-weight:700;min-width:44px;cursor:pointer;font-variant-numeric:tabular-nums}
.xc small{display:block;font-weight:400;font-size:.7rem}
.xc.on{background:var(--accent);color:var(--accent-ink)}
.xsel{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 8px;background:var(--bg)}
.zoom{position:fixed;inset:0;z-index:35;background:var(--bg);display:none;flex-direction:column;overflow-y:auto}
.zoom.open{display:flex}
.zoom header{position:sticky;top:0;background:var(--bg);display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.zoom header b{flex:1}
.zbody{padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 20px);max-width:1000px;width:100%;margin:0 auto}
.dginfo{margin-top:8px;font-size:.9rem}
.dginfo summary{color:var(--accent);font-weight:700;cursor:pointer}
.dginfo ul{margin:6px 0;padding-left:20px}
.dginfo p{margin:0;color:var(--muted)}
.allergy{display:flex;gap:12px;align-items:center;background:var(--bad);color:#fff;border-radius:12px;padding:10px 14px;margin:-4px 0 14px;font-weight:700;font-size:1.05rem;box-shadow:0 0 0 3px var(--bad-soft)}
.allergy span{font-size:1.5rem;line-height:1}
.allergy small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.allergy-line{background:var(--bad-soft)} .allergy-line .k{color:var(--bad);font-weight:700}
.tag.allergy{background:var(--bad);color:#fff;font-weight:700}
.vits{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vit{background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:.92rem}
.vit small{display:block;color:var(--muted);font-size:.72rem}
.vit em{font-style:normal;color:var(--muted);font-size:.78rem;margin-left:6px}
.vit.hi{background:var(--bad-soft);color:var(--bad)}
.sortrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.9rem;color:var(--muted)}
.sortrow select{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;color:var(--ink)}
.agec{color:var(--muted);font-weight:400;font-size:.85rem}
.ideal{display:block;color:var(--accent);font-weight:700}
.ucode{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:10px;background:var(--bg)}
.ucode.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ucode-h small{color:var(--muted);display:block;margin-top:4px;font-size:.8rem}
.ucode .seg{margin-top:6px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ptabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px -16px 0;padding:4px 16px 6px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.ptabs button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ptabs button small{font-weight:400;opacity:.85}
.newev{display:flex;flex-wrap:wrap;gap:8px}
.rdv{display:block;color:var(--accent);font-weight:700;font-size:.88rem;margin-top:2px}
.rhbox{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.92rem}

const ZQ={2.5:-1.95996,5:-1.64485,10:-1.28155,25:-0.67449,50:0,75:0.67449,90:1.28155,95:1.64485,97.5:1.95996};
function whoRow(tab,days){ const w=days/7; if(w<14||w>40) return null; const a=Math.floor(w), b=Math.min(40,a+1), t=w-a; return tab[a].map((v,i)=>v+(tab[b][i]-v)*t); }
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2); const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function whoPct(g,days,sex){
  const tab=sex==='F'?WHO_F:sex==='M'?WHO_M:WHO_ALL, P=sex==='F'||sex==='M'?WHO_PS:WHO_P;
  const row=whoRow(tab,days); if(!row||!(g>0)) return null;
  const L=row.map(Math.log), x=Math.log(g), Z=P.map(p=>ZQ[p]);
  let k=0; while(k<L.length-2 && x>L[k+1]) k++;
  let z=Z[k]+(Z[k+1]-Z[k])*(x-L[k])/(L[k+1]-L[k]); z=Math.max(-3.2,Math.min(3.2,z));
  return {pct:normCdf(z)*100, ref:sex==='F'?'OMS, courbe fille':sex==='M'?'OMS, courbe garçon':'OMS, sexe non précisé'};
}
function pctLabel(x){ return x<1?'< 1':x>99?'> 99':String(Math.round(x)); }
function efw(days){ const r=whoRow(WHO_ALL,days); return r?Math.round(r[4]):null; }

/* ---------- Stockage ----------
   1) compte Claude (capacité db, sous-arbre privé data/users/<id>) : persistant et synchronisé
   2) à défaut, IndexedDB de l’appareil
   3) à défaut, mémoire (perdu à la fermeture) */
let idb=null; const mem={patients:new Map(),files:new Map(),kv:new Map()};
const C={db:null,col:null};
let MODE='memory';
function rq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
async function openDB(){
  try{
    if(!('indexedDB' in window)) return null;
    const r=indexedDB.open(APP_ROLE==='patient'?'suivi-grossesse-patiente':'suivi-grossesse',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('patients',{keyPath:'id'}); const f=d.createObjectStore('files',{keyPath:'id'}); f.createIndex('patientId','patientId'); d.createObjectStore('kv'); };
    const d=await withTimeout(rq(r),4000); if(!d) return null;
    const t=d.transaction('kv','readwrite').objectStore('kv'); await rq(t.put(Date.now(),'_test'));   // vérifie qu’on peut réellement écrire
    return d;
  }catch(e){ return null; }
}
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return false;
    const r=await withTimeout(Promise.all([window.claude.use('db'),window.claude.use('user')]),9000);
    if(!r || !r[0] || !r[1]) return false;
    const uid=await r[1].id(); if(!uid) return false;
    C.db=r[0]; C.col=r[0].collection('data/users/'+uid);
    await C.col.limit(1).get();
    return true;
  }catch(e){ C.db=null; C.col=null; return false; }
}
const clean=o=>JSON.parse(JSON.stringify(o));
const strip=o=>{ const x=clean(o); delete x.kind; return x; };
const CHUNK=180000;
function b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; }
async function cQuery(kind,extra){ let q=C.col.where('kind','==',kind); if(extra) q=q.where(extra[0],'==',extra[1]); const sn=await q.limit(1000).get(); return sn.docs.map(d=>strip(d.data())); }
async function cGetFile(fid){
  const m=await C.col.doc(fid).get(); if(!m.exists) return null; const meta=strip(m.data());
  const parts=await Promise.all(Array.from({length:meta.chunks||0},(_,i)=>C.col.doc('c-'+fid+'-'+i).get()));
  meta.data=unb64(parts.map(p=>p.exists?p.data().d:'').join('')); return meta;
}
async function cPutFile(f){
  const s=b64(f.data); const n=Math.ceil(s.length/CHUNK)||1;
  for(let i=0;i<n;i++) await C.col.doc('c-'+f.id+'-'+i).set({kind:'chunk',fid:f.id,i,d:s.slice(i*CHUNK,(i+1)*CHUNK)});
  await C.col.doc(f.id).set({kind:'file',id:f.id,patientId:f.patientId,cat:f.cat||'',name:f.name,type:f.type,size:f.size,addedAt:f.addedAt,chunks:n});
}
async function cDelFile(fid){ const m=await C.col.doc(fid).get(); const n=m.exists?(m.data().chunks||0):0; await C.col.doc(fid).delete(); for(let i=0;i<n;i++) await C.col.doc('c-'+fid+'-'+i).delete(); }

function store(n,mode){ return idb.transaction(n,mode||'readonly').objectStore(n); }
async function getAll(n){
  if(MODE==='cloud'){ if(n==='patients') return cQuery('patient'); if(n==='files'){ const ms=await cQuery('file'); const out=[]; for(const m of ms){ const f=await cGetFile(m.id); if(f) out.push(f); } return out; } return []; }
  return idb ? rq(store(n).getAll()) : [...mem[n].values()];
}
async function put(n,v,k){
  if(MODE==='cloud'){ if(n==='patients') return C.col.doc(v.id).set(Object.assign(clean(v),{kind:'patient'})); if(n==='kv') return C.col.doc(k).set({kind:'kv',value:clean(v)}); if(n==='files') return cPutFile(v); }
  if(idb) return rq(k!==undefined?store(n,'readwrite').put(v,k):store(n,'readwrite').put(v)); mem[n].set(k!==undefined?k:v.id,v);
}
async function del(n,k){
  if(MODE==='cloud'){ if(n==='files') return cDelFile(k); return C.col.doc(k).delete(); }
  if(idb) return rq(store(n,'readwrite').delete(k)); mem[n].delete(k);
}
async function get(n,k){
  if(MODE==='cloud'){ if(n==='files') return cGetFile(k); const d=await C.col.doc(k).get(); if(!d.exists) return undefined; return n==='kv'?clean(d.data().value):strip(d.data()); }
  return idb ? rq(store(n).get(k)) : mem[n].get(k);
}
async function filesFor(pid){
  if(MODE==='cloud') return cQuery('file',['patientId',pid]);
  if(idb) return rq(store('files').index('patientId').getAll(pid)); return [...mem.files.values()].filter(f=>f.patientId===pid);
}
async function clearAll(){
  if(MODE==='cloud'){ for(const kind of ['patient','file','chunk']){ const sn=await C.col.where('kind','==',kind).limit(1000).get(); for(const d of sn.docs) await C.col.doc(d.id).delete(); } await C.col.doc('settings').delete(); return; }
  for(const n of ['patients','files','kv']){ if(idb) await rq(store(n,'readwrite').clear()); else mem[n].clear(); }
}
/* Copie unique des données déjà présentes sur l’appareil vers le compte */
async function migrateLocalToCloud(){
  if(!idb) return 0;
  try{
    const done=await rq(store('kv').get('migratedToCloud')); if(done) return 0;
    const pats=await rq(store('patients').getAll()); if(!pats.length){ await rq(store('kv','readwrite').put(Date.now(),'migratedToCloud')); return 0; }
    const existing=new Set((await cQuery('patient')).map(p=>p.id));
    const lset=await rq(store('kv').get('settings')); if(lset && !(await C.col.doc('settings').get()).exists) await C.col.doc('settings').set({kind:'kv',value:clean(lset)});
    let n=0; for(const p of pats){ if(existing.has(p.id)) continue; await C.col.doc(p.id).set(Object.assign(clean(p),{kind:'patient'})); n++; }
    for(const f of await rq(store('files').getAll())){ if(!(await C.col.doc(f.id).get()).exists) await cPutFile(f); }
    await rq(store('kv','readwrite').put(Date.now(),'migratedToCloud'));
    return n;
  }catch(e){ return 0; }
}

const S={ settings:null, patients:[], filter:'active', q:'', showOver:false, agendaDays:14, asOf:null, addingEvent:false, crits:[], sort:(()=>{ try{ return localStorage.getItem('sg-sort')||'terme'; }catch(e){ return 'terme'; } })(), selecting:false, sel:new Set() };
async function saveSettings(){ try{ await put('kv',S.settings,'settings'); }catch(e){ toast('Échec de l’enregistrement des réglages'); } }
async function savePatient(p){
  p.updatedAt=Date.now();
  const i=S.patients.findIndex(x=>x.id===p.id); if(i<0) S.patients.push(p); else S.patients[i]=p;   // toujours visible dans la liste
  try{ await put('patients',p); S.saveError=false; }
  catch(e){ S.saveError=true; toast(e && e.code==='quota_exceeded' ? 'Espace de stockage plein : dossier non sauvegardé' : 'Dossier non sauvegardé : vérifiez la connexion puis réessayez'); }
}

/* ---------- Calculs obstétricaux ---------- */
function baseT(p){
  const T=S.settings.termDays;
  switch(p.datingMethod){
    case 'dg':   { const d=parseD(p.dg); return d==null?null:d-14*DAY; }
    case 'echo': { const d=parseD(p.echoDate); if(d==null || p.echoSA==='' || p.echoSA==null) return null; return d-((+p.echoSA||0)*7+(+p.echoJ||0))*DAY; }
    case 'dpa':  { const d=parseD(p.dpaManual); return d==null?null:d-T*DAY; }
    default:     { const d=parseD(p.ddr); if(d==null) return null; const c=+p.cycle||S.settings.cycle||28; return d+(c-28)*DAY; }
  }
}
function info(p,at){
  const b=baseT(p); if(b==null) return {ok:false};
  const t=at||today(); const dpa=b+S.settings.termDays*DAY;
  return {ok:true, base:b, ga:Math.round((t-b)/DAY), dpa, toDpa:Math.round((dpa-today())/DAY)};
}
function uterusCic(p){ return (+p.cesariennes>0) || !!p.uterusCicatriciel; }
function applies(p,c){
  switch(c){ case 'rhneg': return p.rhesus==='-' && p.rhesusConj!=='-' && !rhdNegConfirmed(p); case 'cesar': return uterusCic(p); case 'dgrisk': return !!p.dgRisk;
    case 'multi': return +p.parite>0; case 'primi': return !(+p.parite>0); case 'multiple': return +p.multiple>1; default: return true; }
}
function milestonesFor(p,inf){
  const t=today(); const out=[];
  for(const m of S.settings.milestones){
    if(!applies(p,m.cond)) continue;
    const s=inf.base+m.s*DAY, e=inf.base+((m.e==null?m.s:m.e))*DAY;
    const done=(p.done||{})[m.id]; const rv=(p.rdv||{})[m.id], rd=rv?parseD(rv.date):null;
    const st= done?'fait': rd!=null?(t<rd?'avenir':t===rd?'encours':'depasse'): t<s?'avenir': t<=e?'encours':'depasse';
    out.push({kind:'ms', id:m.id, name:m.name, sDays:m.s, eDays:m.e, s, e, st, done, byEval:!!(p.doneBy||{})[m.id], idealDays:m.ideal, ideal:m.ideal!=null?inf.base+m.ideal*DAY:null, rdv:rd, rv, time:rv&&rv.time, auto:m.auto});
  }
  if(p.rhesus==='-' && p.rhesusConj!=='-'){
    const Rr=rhdResults(p);
    const mk=(id,name,s0,e0,res)=>{ const s=inf.base+s0*DAY,e=inf.base+e0*DAY; const rv=(p.rdv||{})[id], rd=rv?parseD(rv.date):null; const done=res?(res.date||iso(t)):(p.done||{})[id];
      out.push({kind:'ms',id,name:name+(res?' : '+res.res.toLowerCase():''),sDays:s0,eDays:e0,s,e,st:done?'fait':rd!=null?(t<rd?'avenir':t===rd?'encours':'depasse'):t<s?'avenir':t<=e?'encours':'depasse',done,rdv:rd,rv,time:rv&&rv.time}); };
    mk('rhd1','Génotypage RhD fœtal (1re détermination)',77,104,Rr[0]);
    if(Rr[0]&&Rr[0].res!=='Positif'){ const d0=parseD(Rr[0].date); const g=d0!=null?Math.round((d0-inf.base)/DAY):0; mk('rhd2','Génotypage RhD fœtal (contrôle à ≥ 15 j, après 15 SA)',Math.max(106,g+15),195,Rr[1]); }
  }
  const pl=p.planned;
  if(pl && pl.type){
    const s=inf.base+266*DAY, e=inf.base+273*DAY, d=parseD(pl.date); const done=(p.done||{}).plan;
    const ref=d!=null?d:e;
    out.push({kind:'plan', id:'plan', name:pl.type+(planMotifs(pl).length?' – '+planMotifs(pl).join(', '):''), sDays:266, eDays:273, s, e, st:done?'fait':today()<(d!=null?d:s)?'avenir':today()<=ref?'encours':'depasse', done, exact:d});
  }
  const V=S.settings.vacc||{};
  for(const [k,id,name,sa0,sa1] of [['grippe','vgrippe','Vaccin grippe',14,null],['covid','vcovid','Vaccin Covid-19',14,null],['vrs','vrs','Vaccin VRS',224,258]]){
    const c=V[k]; if(!c||!c.on||!/^\d{2}-\d{2}$/.test(c.from||'')||!/^\d{2}-\d{2}$/.test(c.to||'')) continue;
    const A=inf.base+sa0*DAY, B=sa1==null?inf.dpa:inf.base+sa1*DAY;
    const [fm,fdd]=c.from.split('-').map(Number), [tm,tdd]=c.to.split('-').map(Number);
    for(let y=new Date(A).getUTCFullYear()-1;y<=new Date(B).getUTCFullYear();y++){
      const ss=Date.UTC(y,fm-1,fdd), se=Date.UTC((tm*100+tdd)<(fm*100+fdd)?y+1:y,tm-1,tdd);
      const s=Math.max(A,ss), e=Math.min(B,se); if(s>e) continue;
      const mid=id+'-'+y; const done=(p.done||{})[mid];
      const yy=new Date(ss).getUTCFullYear(), ye=new Date(se).getUTCFullYear();
      out.push({kind:'ms',id:mid,name:name+' (campagne '+(yy===ye?yy:yy+'-'+ye)+')',sDays:Math.round((s-inf.base)/DAY),eDays:Math.round((e-inf.base)/DAY),s,e,st:done?'fait':t<s?'avenir':t<=e?'encours':'depasse',done});
    }
  }
  for(const ev of (p.events||[])){
    const d=parseD(ev.date); if(d==null) continue;
    const done=(p.done||{})[ev.id];
    out.push({kind:'ev', id:ev.id, name:ev.name, evKind:ev.kind, time:ev.time, note:ev.note, s:d, e:d, st: done?'fait': d<t?'depasse': d===t?'encours':'avenir', done, ga:Math.round((d-inf.base)/DAY)});
  }
  out.push({kind:'dpa', id:'dpa', name:'Jour du terme prévu', s:inf.dpa, e:inf.dpa, sDays:S.settings.termDays, st: t>inf.dpa?'depasse':t===inf.dpa?'encours':'avenir'});
  out.sort((a,b)=>a.s-b.s || a.e-b.e);
  return out;
}
function conge(p,inf){
  const mult=+p.multiple||1, par=+p.parite||0;
  let pre, post;
  if(mult>=3){ pre=24; post=22; } else if(mult===2){ pre=12; post=22; } else if(par>=2){ pre=8; post=18; } else { pre=6; post=10; }
  return {pre, post, start:inf.dpa-pre*7*DAY, end:inf.dpa+post*7*DAY};
}

/* ---------- Navigation ---------- */
let CUR=(location.hash||'').slice(1);
function route(){
  const h=CUR;
  if(h.startsWith('carte.')) return {v:'carte',data:h.slice(6)};
  if(h.startsWith('patient-')){ const id=h.slice(8); return {v:'patient', id}; }
  if(h==='agenda' || h==='reglages' || h==='analyse') return {v:h};
  return {v:'liste'};
}
function go(h){
  const changed=CUR!==h; CUR=h;
  if(changed){ S.asOf=null; S.addingEvent=false; }
  try{ if(location.hash.slice(1)!==h) history.replaceState(null,'','#'+h); }catch(e){}
  render(); if(changed) window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h===CUR) return; CUR=h; S.asOf=null; S.addingEvent=false; render(); window.scrollTo(0,0); });
$$('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
$('#btnNew').addEventListener('click',()=>isPatient()?pickDossier():openEditor(null));
function pickDossier(){ const i=$('#importInput'); i.value=''; i.onchange=()=>importDossierFile(i.files[0]); i.click(); }

function render(){
  $('#view').onchange=null;
  document.body.classList.toggle('role-patient',isPatient());
  $('#btnNew').textContent=isPatient()?'📥 Ouvrir un dossier':'＋ Patiente';
  $('.brand').lastChild.textContent=isPatient()?' Mon suivi de grossesse':' Suivi de grossesse';
  if(isPatient()&&['agenda','analyse'].includes(route().v)){ go('liste'); return; }
  if(route().v!=='liste'){ S.selecting=false; S.sel=new Set(); }
  const r=route();
  $$('[data-nav]').forEach(b=>{ const cur=(r.v==='patient'?'liste':r.v)===b.dataset.nav; if(cur) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(r.v==='patient') renderPatient(r.id);
  else if(r.v==='agenda') renderAgenda();
  else if(r.v==='reglages') renderSettings();
  else if(r.v==='analyse') renderAnalyse();

function rulerSVG(items,inf){
  const W=360, x0=14, x1=346, max=294; const X=d=>x0+(Math.max(0,Math.min(max,d))/max)*(x1-x0);
  const ms=items.filter(i=>i.kind==='ms');
  const lanes=[]; const placed=[];
  for(const m of ms){ const a=m.sDays, b=(m.eDays==null?m.sDays:m.eDays); let l=0; while(lanes[l]!=null && lanes[l]>a-2) l++; lanes[l]=b; placed.push({m,l,a,b}); }
  const nl=Math.max(1,lanes.length); const top=26, lh=8; const H=top+nl*lh+30;
  const col={fait:'var(--ok)',encours:'var(--accent)',avenir:'var(--muted)',depasse:'var(--bad)'};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Frise de la grossesse de 0 à 42 SA">`;
  s+=`<rect x="${X(0)}" y="${top-6}" width="${X(98)-X(0)}" height="${nl*lh+8}" fill="var(--surface-2)" opacity=".55"/>`;
  s+=`<rect x="${X(196)}" y="${top-6}" width="${X(max)-X(196)}" height="${nl*lh+8}" fill="var(--surface-2)" opacity=".55"/>`;
  [['T1',49],['T2',147],['T3',245]].forEach(([l,d])=>{ s+=`<text x="${X(d)}" y="12" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="700">${l}</text>`; });
  for(const p of placed){ const y=top+p.l*lh; const w=Math.max(4,X(p.b)-X(p.a)); s+=`<rect x="${X(p.a)}" y="${y}" width="${w}" height="5" rx="2.5" fill="${col[p.m.st]}" opacity="${p.m.st==='avenir'?.45:1}"><title>${esc(p.m.name)}</title></rect>`; }
  const by=top+nl*lh+6;
  s+=`<line x1="${x0}" x2="${x1}" y1="${by}" y2="${by}" stroke="var(--line)" stroke-width="1.5"/>`;
  for(let w=0;w<=42;w+=2){ const x=X(w*7); s+=`<line x1="${x}" x2="${x}" y1="${by}" y2="${by+(w%4?3:6)}" stroke="var(--muted)" stroke-width="1"/>`; if(w%8===0 || w===42) s+=`<text x="${x}" y="${by+17}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${w}</text>`; }
  const dx=X(S.settings.termDays); s+=`<line x1="${dx}" x2="${dx}" y1="${top-8}" y2="${by}" stroke="var(--ink)" stroke-dasharray="2 2" stroke-width="1"/>`;
  if(inf.ga>=0){ const tx=X(inf.ga); s+=`<line x1="${tx}" x2="${tx}" y1="${top-10}" y2="${by+2}" stroke="var(--accent)" stroke-width="2.5"/><circle cx="${tx}" cy="${top-10}" r="3.5" fill="var(--accent)"/>`; }
  return s+'</svg>';
}
function stLabel(it){

  if(it.st==='encours'){ const r=Math.round((it.e-t)/DAY); return `<small style="color:var(--accent)">${it.kind==='dpa'?'Aujourd’hui':r===0?'Dernier jour':'Encore '+r+' j'}</small>`; }

    h+=`<section class="sec"><h2>Traitements</h2><div class="card">${tf?`<div class="txt" style="padding-bottom:0"><span class="k">De fond</span></div>${tf}`:''}${tg?`<div class="txt" style="padding-bottom:0"><span class="k">Instaurés pendant la grossesse</span></div>${tg}`:''}${!tf&&!tg?'<div class="txt" style="color:var(--muted)">Aucun traitement</div>':''}</div></section>`;
    const pm=list(p.pathoMat), pf=list(p.pathoFoet);
    h+=`<section class="sec"><h2>Pathologies de la grossesse</h2><div class="card">${pm.length?`<div class="txt"><span class="k">Maternelles</span>${esc(pm.join(', '))}</div>`:''}${pf.length?`<div class="txt"><span class="k">Fœtales et annexielles</span>${esc(pf.join(', '))}</div>`:''}${p.pathoNotes?tx('Précisions',p.pathoNotes):''}${!pm.length&&!pf.length&&!p.pathoNotes?'<div class="txt" style="color:var(--muted)">Aucune pathologie signalée</div>':''}</div></section>`;
    h+=`<section class="sec"><h2>Accouchement prévu</h2><div class="card"><div class="kv"><span class="k">Lieu prévu</span><span class="v">${esc(lieuLabel(p)||'Non renseigné')}${p.niveau?' (type '+esc(p.niveau)+')':''}</span></div></div></section>`;
    const cr=list(p.corr).filter(c=>c.nom||c.contact);
    h+=`<section class="sec"><h2>Correspondants</h2><div class="card">${cr.length?cr.map(c=>`<div class="kv"><span class="k">${esc(c.role||'Autre')}</span><span class="v">${esc(c.nom||'')}${c.contact?`<br><small style="font-weight:400;color:var(--muted)">${esc(c.contact)}</small>`:''}</span></div>`).join(''):'<div class="txt" style="color:var(--muted)">Aucun correspondant renseigné.</div>'}</div></section>`;
    const rel=related(p);
    h+=`<section class="sec"><h2>Autres dossiers de la patiente</h2><div class="card">${rel.length?rel.map(x=>`<button class="row" data-open="${esc(x.id)}"><span class="rmain"><span class="nm">${esc(pregLabel(x))}</span><span style="color:var(--muted);font-size:.92rem">${esc(issueSummary(x)||(x.status==='archived'?'Archivée sans issue renseignée':'Grossesse en cours'))}</span></span><span aria-hidden="true" style="color:var(--muted)">›</span></button>`).join(''):'<div class="txt" style="color:var(--muted)">Aucun autre dossier pour cette patiente.</div>'}</div></section>`;

    h+=`<div class="actions">${p.status==='archived'?'<button class="btn primary" id="newPreg">＋ Nouvelle grossesse</button><button class="btn" id="edit">Modifier la fiche</button><button class="btn" id="unarch">Rouvrir le dossier</button>':'<button class="btn primary" id="edit">Modifier la fiche</button><button class="btn" id="arch">Clôturer la grossesse</button>'}<button class="btn" id="shareBtn">Remettre à la patiente</button><button class="btn" id="msgBtn">✉ Message</button><button class="btn" id="pdfBtn">Imprimer / PDF</button><button class="btn danger" id="delP">Supprimer</button></div>`;

  else if(T==='consult'){
    h+=`<section class="sec"><div class="newev"><button class="btn primary" data-newev="c|prog">＋ Consultation programmée</button><button class="btn" data-newev="c|urg">＋ Consultation d’urgence</button><button class="btn primary" data-newev="e|prog">＋ Échographie programmée</button><button class="btn" data-newev="e|urg">＋ Échographie d’urgence</button><button class="btn" id="addEchoPdf">＋ Compte rendu d’échographie (PDF ou photo)</button></div>

    }
  }
  else if(T==='bio'){
    h+=`<section class="sec"><div class="newev"><button class="btn primary" id="addBio">＋ Ajouter un résultat</button><button class="btn" id="addBioPdf">＋ Ajouter un bilan (PDF ou photo)</button></div></section>`;

    const B=list(p.bio).slice().sort((x,y)=>(y.date||'').localeCompare(x.date||''));
    h+=`<section class="sec"><h2>Résultats</h2><div class="card">${B.length?B.map(b=>`<button class="row" data-bio="${esc(b.id)}"><span class="rmain"><span class="nm">${esc(b.exam==='Autre'?b.examAutre||'Autre examen':b.exam)}</span><span class="num" style="font-size:.95rem">${esc([b.sero,[b.res,b.unit].filter(Boolean).join(' ')].filter(Boolean).join(' – '))||'—'}</span><span class="flags" style="margin-top:2px">${b.interp?`<span class="tag ${b.interp==='Normal'?'ok':b.interp==='Anormal'?'bad':'warn'}">${esc(b.interp)}</span>`:''}<span class="tag num">${b.date?fd(parseD(b.date)):'Date ?'}${b.date&&info(p).ok?' – '+sa(Math.round((parseD(b.date)-info(p).base)/DAY)):''}</span></span>${b.notes?`<span style="color:var(--muted);font-size:.9rem">${esc(b.notes)}</span>`:''}</span><span aria-hidden="true" style="color:var(--muted)">›</span></button>`).join(''):'<div class="txt" style="color:var(--muted)">Aucun résultat enregistré.</div>'}</div></section>`;
    h+=`<section class="sec"><h2>Bilans et résultats en PDF</h2><div class="card" id="docs"><div class="txt" style="color:var(--muted)">Chargement…</div></div></section>`;
  }
  else if(T==='hosp'){
    h+=`<section class="sec"><div class="newev"><button class="btn primary" id="addHosp2">＋ Ajouter une hospitalisation</button></div></section>`;
    const hs=list(p.hospits).slice().sort((x,y)=>(y.debut||'').localeCompare(x.debut||''));
    h+=`<section class="sec"><h2>Hospitalisations pendant la grossesse</h2><div class="card">${hs.length?hs.map(x=>{ const d=parseD(x.debut), f=parseD(x.fin); const dur=d!=null&&f!=null?Math.round((f-d)/DAY):null;
      return `<button class="row" data-hosp="${esc(x.id)}"><span class="rmain"><span class="nm num">${d!=null?fd(d):'?'}${f!=null?' → '+fd(f):' (en cours)'}${dur!=null?` <small class="agec">${dur} j</small>`:''}</span><span>${esc(x.motif||'Motif non précisé')}</span><span style="color:var(--muted);font-size:.9rem">${esc([x.lieu,d!=null&&info(p).ok?'à '+sa(Math.round((d-info(p).base)/DAY)):'',x.notes].filter(Boolean).join(' – '))}</span></span><span aria-hidden="true" style="color:var(--muted)">›</span></button>`; }).join(''):'<div class="txt" style="color:var(--muted)">Aucune hospitalisation pendant cette grossesse.</div>'}</div></section>`;
  }
  else if(T==='suites'){
    if(p.status==='archived') h+=issueHTML(p,inf);
    else h+=`<section class="sec"><div class="card"><div class="txt">La grossesse est en cours. L’accouchement et les suites de couches se renseignent à la clôture du dossier.</div></div><div class="actions"><button class="btn primary" id="arch">Clôturer la grossesse</button></div></section>`;
  }
  else if(T==='conseils'){
    const FS=isPatient()?fichesFor(p).filter(f=>!f.off):fichesFor(p);
    if(isPatient()) h+=FS.length?FS.map(f=>`<section class="sec"><details class="fiche" open><summary>${esc(f.title)}</summary><div class="ftxt">${esc(f.text)}</div></details></section>`).join(''):'<div class="card empty" style="margin-top:12px">Aucun conseil transmis.</div>';
    else { h+=`<section class="sec"><p class="note" style="margin:0 4px 8px">Fiches retenues d’après le dossier. Décochez celles à ne pas transmettre à cette patiente. Les textes se modifient dans Réglages → Fiches conseils.</p><div class="card">${FS.length?FS.map(f=>`<details class="fiche-pro"><summary><input type="checkbox" data-fiche="${esc(f.id)}" ${f.off?'':'checked'} aria-label="Transmettre ${esc(f.title)}"> <b>${esc(f.title)}</b> <small>${esc(FCOND[f.cond]?FCOND[f.cond][0]:'')}</small></summary><div class="ftxt">${esc(f.text)}</div></details>`).join(''):'<div class="txt" style="color:var(--muted)">Aucune fiche applicable.</div>'}</div></section>`; }
  }
  else if(T==='docs'){
    h+=`<section class="sec"><h2>Documents PDF <button class="link" id="addPdf">＋ Ajouter</button></h2><p class="note" style="margin:0 4px 8px">Astuce : pour un scan de qualité, utilisez l’app Fichiers (⋯ → Scanner des documents), puis « Choisir un PDF ».</p><div class="card" id="docs"><div class="txt" style="color:var(--muted)">Chargement…</div></div></section>`;
  }
  v.innerHTML=h;

  const on=(sel,fn)=>{ const el=$(sel); if(el) el.addEventListener('click',fn); };
  on('#bk',()=>go('liste'));
  on('#edit',()=>openEditor(p));
  on('#pdfTop',()=>openPrint(p,isPatient())); on('#pdfBtn',()=>openPrint(p)); on('#shareBtn',()=>openShare(p)); on('#pCard',()=>openMyCard(p)); on('#pShare',()=>shareMyDossier(p)); on('#pTrans',()=>showTransferScreen(p,myCodeOf(p))); on('#msgBtn',()=>openMessage(p));
  $$('[data-fiche]').forEach(c=>{ c.addEventListener('click',e=>e.stopPropagation()); c.addEventListener('change',async()=>{ const id=c.dataset.fiche; p.fichesOff=list(p.fichesOff).filter(x=>x!==id); if(!c.checked) p.fichesOff.push(id); await savePatient(p); }); });
  $$('[data-ptab]').forEach(b=>b.addEventListener('click',()=>{ S.ptab=b.dataset.ptab; renderPatient(id); const nav=$('.ptabs'); if(nav) nav.scrollIntoView({block:'start',behavior:'auto'}); }));
  $$('[data-goto]').forEach(b=>b.addEventListener('click',()=>{ S.ptab=b.dataset.goto; renderPatient(id); }));
  $$('[data-newev]').forEach(b=>b.addEventListener('click',()=>{ const [k,u]=b.dataset.newev.split('|'); openEval(p,null,{consult:k==='c',echo:k==='e',urg:u==='urg'}); }));
  $$('[data-ev]').forEach(b=>b.addEventListener('click',()=>openEval(p,b.dataset.ev)));
  const ao=$('#asOf'); if(ao) ao.addEventListener('change',e=>{ const d=parseD(e.target.value); S.asOf=d; renderPatient(id); });
  $$('[data-done]').forEach(b=>b.addEventListener('click',async()=>{ p.done=p.done||{}; const k=b.dataset.done; if(p.done[k]){ delete p.done[k]; if(p.doneBy) delete p.doneBy[k]; } else p.done[k]=iso(today()); await savePatient(p); renderPatient(id); }));
  $$('[data-plan]').forEach(b=>b.addEventListener('click',()=>openPlan(p)));
  $$('[data-rdv]').forEach(b=>b.addEventListener('click',()=>openRdv(p,b.dataset.rdv)));
  $$('[data-evedit]').forEach(b=>b.addEventListener('click',()=>openEvent(p,b.dataset.evedit)));
  on('#addEv',()=>openEvent(p,null));
  const cpj=$('#cpj'); if(cpj) cpj.addEventListener('change',async e=>{ p.congePathoJ=e.target.value; await savePatient(p); renderPatient(id); });
  on('#addBio',()=>openBio(p,null)); $$('[data-bio]').forEach(b=>b.addEventListener('click',()=>openBio(p,b.dataset.bio)));
  on('#addBioPdf',()=>openAddDoc(p,'Biologie','bio')); on('#addEchoPdf',()=>{ const ec=evalsOf(p).find(e=>e.echo); const map={'T1':'Échographie T1','T2 (morphologique)':'Échographie T2','T3':'Échographie T3'}; openAddDoc(p,ec&&map[ec.etype]||'Échographie de croissance / autre','echo'); });
  on('#addHosp2',()=>openHosp(p,null)); $$('[data-hosp]').forEach(b=>b.addEventListener('click',()=>openHosp(p,b.dataset.hosp)));
  on('#arch',()=>openOutcome(p)); on('#editIssue',()=>openOutcome(p));
  on('#unarch',async()=>{ if(!await ask({title:'Rouvrir ce dossier ?',body:'La grossesse repassera dans les dossiers en cours. L’issue saisie est conservée.',ok:'Rouvrir'})) return; p.status='active'; await savePatient(p); toast('Dossier rouvert'); renderPatient(id); });
  on('#newPreg',()=>openEditor(null,prefillFrom(p)));
  bindRows($('#view'));
  on('#delP',async()=>{ if(!await ask({title:'Supprimer ce dossier ?',body:`Le dossier de ${fullName(p)} et ses documents PDF seront définitivement effacés. Cette action est irréversible.`,ok:'Supprimer',danger:true})) return;
    if(await deletePatients([p.id])){ toast('Dossier supprimé'); go('liste'); } });
  on('#addPdf',()=>openAddDoc(p,'Autre',null));
  if(T==='docs') drawDocs(p,null); if(T==='bio') drawDocs(p,'bio'); if(T==='consult') drawDocs(p,'echo');
}

/* ---------- Rendez-vous, biologie, hospitalisations ---------- */
function miniSheet(title,body,onSave,onDel){
  const sh=$('#sheet');
  sh.innerHTML=`<div class="sheet-h"><button class="btn ghost" id="mCancel">Annuler</button><h2 id="sheetTitle">${esc(title)}</h2><button class="btn primary" id="mSave">Enregistrer</button></div><div class="form">${body}${onDel?'<div class="actions"><button class="btn danger" id="mDel">Supprimer</button></div>':''}</div>`;
  sh.classList.add('open'); document.body.style.overflow='hidden'; sh.scrollTop=0;
  const close=()=>{ sh.classList.remove('open'); sh.innerHTML=''; sh.oninput=sh.onchange=sh.onclick=null; document.body.style.overflow=''; };
  const val=n=>{ const r=sh.querySelector(`[name="${n}"]:checked`); if(r) return r.value; const el=sh.querySelector(`[name="${n}"]`); return el&&el.type!=='radio'&&el.type!=='checkbox'?el.value.trim():''; };
  $('#mCancel').addEventListener('click',close);
  $('#mSave').addEventListener('click',async()=>{ if(await onSave(val,sh)!==false) close(); });
  const d=$('#mDel'); if(d) d.addEventListener('click',async()=>{ if(!await ask({title:'Supprimer ?',body:'Cette action est irréversible.',ok:'Supprimer',danger:true})) return; await onDel(); close(); });
  return {sh,val};
}
function openRdv(p,msId){
  if(isPatient()) return;
  const inf=info(p); const it=milestonesFor(p,inf).find(x=>x.id===msId); if(!it) return;
  const rv=(p.rdv||{})[msId]||{};
  const {sh,val}=miniSheet(it.name,`<fieldset><legend>Date du rendez-vous</legend><div class="fbox">
    <div class="note" style="margin:4px 0 0">Fenêtre recommandée : ${esc(range(it.s,it.e===it.s?null:it.e))}${it.ideal!=null?' – cible '+esc(sa(it.idealDays))+' : '+esc(fd(it.ideal)):''}</div>
    <div class="grid2">${F('Date','<input type="date" name="rdate" value="'+esc(rv.date||(it.ideal!=null?iso(Math.max(it.ideal,today())):''))+'">')}${F('Heure','<input type="time" name="rtime" value="'+esc(rv.time||'')+'">')}</div>
    <div class="preview num" id="rAg" style="display:none"></div>
    ${F('Lieu / praticien / remarque','<input name="rnote" value="'+esc(rv.note||'')+'">')}
    <div class="note" style="margin:8px 0 0">Le rendez-vous reste « prévu » jusqu’à la consultation ou l’échographie du jour, qui le valide. Vous pouvez changer la date à tout moment.</div></div></fieldset>`,
    async v=>{ const d=v('rdate'); if(!d){ toast('Choisissez une date'); return false; } p.rdv=p.rdv||{}; p.rdv[msId]={date:d,time:v('rtime'),note:v('rnote')}; await savePatient(p); toast('Rendez-vous fixé'); renderPatient(p.id); },
    rv.date?async()=>{ delete p.rdv[msId]; await savePatient(p); renderPatient(p.id); }:null);
  const sync=()=>{ const d=parseD(val('rdate')), el=$('#rAg'); if(d!=null&&inf.ok){ el.style.display=''; const g=Math.round((d-inf.base)/DAY); el.textContent='Soit '+sa(g)+(d<it.s||d>it.e?' – en dehors de la fenêtre recommandée':''); } else el.style.display='none'; };
  sh.oninput=sync; sh.onchange=sync; sync();
}
function openEvent(p,evId){
  if(isPatient()) return;
  const ex=evId?list(p.events).find(e=>e.id===evId):null; const e=Object.assign({kind:'consult',name:'',date:'',time:'',note:''},ex||{});
  const inf=info(p);
  const {sh,val}=miniSheet(ex?'Rendez-vous':'Nouveau rendez-vous',`<fieldset><legend>Rendez-vous</legend><div class="fbox">
    <div class="f"><span>Type</span>${radios('ekind',RDV_KINDS,e.kind||'autre')}</div>
    ${F('Intitulé (ex. Échographie de croissance, Consultation anesthésie…)','<input name="ename" value="'+esc(e.name)+'">')}
    <div class="grid2">${F('Date','<input type="date" name="edate" value="'+esc(e.date)+'">')}${F('Heure','<input type="time" name="etime" value="'+esc(e.time||'')+'">')}</div>
    <div class="preview num" id="evAg" style="display:none"></div>
    ${F('Lieu / praticien / remarque','<input name="enote" value="'+esc(e.note||'')+'">')}</div></fieldset>`,
    async v=>{ if(!v('ename')||!v('edate')){ toast('Indiquez un intitulé et une date'); return false; } const o={id:e.id||uid('ev'),kind:v('ekind'),name:v('ename'),date:v('edate'),time:v('etime'),note:v('enote')}; p.events=list(p.events).filter(x=>x.id!==o.id); p.events.push(o); await savePatient(p); toast('Rendez-vous enregistré'); renderPatient(p.id); },
    ex?async()=>{ p.events=list(p.events).filter(x=>x.id!==ex.id); if(p.done) delete p.done[ex.id]; await savePatient(p); renderPatient(p.id); }:null);
  const sync=()=>{ const d=parseD(val('edate')), el=$('#evAg'); if(d!=null&&inf.ok){ el.style.display=''; el.textContent='Soit '+sa(Math.round((d-inf.base)/DAY)); } else el.style.display='none'; };
  sh.oninput=sync; sh.onchange=sync; sync();
}
function openBio(p,bid){
  if(isPatient()) return;
  const ex=bid?list(p.bio).find(b=>b.id===bid):null; const b=Object.assign({date:iso(today()),exam:'',examAutre:'',res:'',unit:'',interp:'',notes:''},ex||{});
  const inf=info(p);
  const {sh,val}=miniSheet(ex?'Résultat biologique':'Nouveau résultat',`<fieldset><legend>Examen</legend><div class="fbox">
    ${F('Date du prélèvement','<input type="date" name="bdate" value="'+esc(b.date)+'">')}<div class="preview num" id="bAg" style="display:none"></div>
    <label class="f"><span>Examen</span><select name="bexam"><option value="">—</option>${[...BIO_LIST,'Autre'].map(x=>`<option ${b.exam===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>

const BISHOP_ITEMS=[['bDil','Dilatation',[['0','Fermé'],['1','1–2 cm'],['2','3–4 cm'],['3','≥ 5 cm']]],['bEff','Effacement',[['0','0–30 %'],['1','40–50 %'],['2','60–70 %'],['3','≥ 80 %']]],['bHaut','Hauteur de la présentation',[['0','Mobile (−3)'],['1','Amorcée (−2)'],['2','Fixée (−1/0)'],['3','Engagée (+1/+2)']]],['bCons','Consistance',[['0','Ferme'],['1','Moyenne'],['2','Molle']]],['bPos','Position du col',[['0','Postérieur'],['1','Intermédiaire'],['2','Antérieur']]]];

function applyEvalValidation(p,e){
  p.done=p.done||{}; p.doneBy=p.doneBy||{}; const names=[];
  for(const [k,v] of Object.entries(p.doneBy)) if(v===e.id){ delete p.doneBy[k]; delete p.done[k]; }
  if(e.urg) return names;
  const inf=info(p), d=parseD(e.date); if(!inf.ok||d==null) return names;
  const mark=(id,name)=>{ p.done[id]=e.date; p.doneBy[id]=e.id; names.push(name); };
  const kindOK=a=>(a==='consult'&&e.consult!==false)||(a==='echo'&&e.echo);
  const MAP={'T1':'echo1','T2 (morphologique)':'echo2','T3':'echo3'};
  const MS=S.settings.milestones.filter(m=>m.auto&&applies(p,m.cond));
  if(e.echo&&MAP[e.etype]){ const m=MS.find(x=>x.id===MAP[e.etype]); if(m&&!p.done[m.id]) mark(m.id,m.name); }
  for(const m of MS){ if(p.done[m.id]||!kindOK(m.auto)) continue; const rv=(p.rdv||{})[m.id]; if(rv&&rv.date===e.date&&!(m.auto==='echo'&&e.etype&&MAP[e.etype]!==m.id)) mark(m.id,m.name); }
  for(const ev of list(p.events)){ if(p.done[ev.id]||ev.date!==e.date) continue; if(ev.kind==='consult'&&e.consult!==false||ev.kind==='echo'&&e.echo) mark(ev.id,ev.name); }
  for(const m of MS){ if(p.done[m.id]||!kindOK(m.auto)) continue; if(m.auto==='echo'&&e.etype&&MAP[e.etype]!==m.id) continue;
    const s=inf.base+m.s*DAY, en=inf.base+((m.e==null?m.s:m.e))*DAY; if(d<s||d>en) continue;
    mark(m.id,m.name); if(p.rdv&&p.rdv[m.id]&&p.rdv[m.id].date!==e.date) p.rdv[m.id].date=e.date; }
  return names;
}

async function addPdfs(p,files,cat,filter){
  let n=0;

/* Photos → PDF */
function readImage(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ const max=1700, k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); res({data:c.toDataURL('image/jpeg',0.82),w:c.width,h:c.height}); }; im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); }; im.src=url; }); }
function photoToPdf(p,cat,filter){
  const pages=[]; let inp=document.getElementById('photoInput');
  if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment'); inp.id='photoInput'; inp.hidden=true; document.body.appendChild(inp); }
  const m=$('#modal'), b=$('#modalBox');
  const draw=()=>{ b.innerHTML=`<h3>Photographier un document</h3><p>Rubrique : <b>${esc(cat)}</b><br>${pages.length?pages.length+' page'+(pages.length>1?'s':'')+' prise'+(pages.length>1?'s':'')+'.':'Posez le document à plat, bien éclairé.'}</p>
    <div class="thumbs">${pages.map(pg=>`<img src="${pg.data}" alt="">`).join('')}</div>
    <div class="bx"><button class="btn" data-a="0">Annuler</button><button class="btn" data-a="add">📷 ${pages.length?'Ajouter une page':'Prendre la photo'}</button>${pages.length?'<button class="btn primary" data-a="ok">Créer le PDF</button>':''}</div>`; m.classList.add('open'); };
  inp.onchange=async()=>{ const files=[...inp.files]; for(const f of files){ try{ pages.push(await readImage(f)); }catch(e){ toast('Image illisible'); } } inp.value=''; draw(); };
  m.onclick=async e=>{ const a=e.target.closest('[data-a]'); if(!a) return;
    if(a.dataset.a==='0'){ m.classList.remove('open'); m.onclick=null; return; }
    if(a.dataset.a==='add'){ inp.click(); return; }
    if(a.dataset.a==='ok'){ a.disabled=true; a.textContent='Création…';
      try{ const JsPDF=await loadJsPDF(); const doc=new JsPDF({unit:'mm',format:'a4'}); const W=210,H=297,M=8;
        pages.forEach((pg,i)=>{ if(i) doc.addPage(); const k=Math.min((W-2*M)/pg.w,(H-2*M)/pg.h); const w=pg.w*k,h=pg.h*k; doc.addImage(pg.data,'JPEG',(W-w)/2,(H-h)/2,w,h); });
        const blob=doc.output('blob'); const name=cat+' – '+fd(today())+'.pdf';
        await put('files',{id:uid('f'),patientId:p.id,cat,name,type:'application/pdf',size:blob.size,addedAt:Date.now(),data:await blob.arrayBuffer()});
        m.classList.remove('open'); m.onclick=null; toast('Document ajouté dans « '+cat+' »'); drawDocs(p,filter);
      }catch(err){ a.disabled=false; a.textContent='Créer le PDF'; toast('Création du PDF impossible (connexion Internet nécessaire la première fois)'); } } };
  draw(); inp.click();
}

let viewing=null, vScale=1, vRun=0;
let pdfjsP=null;
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!pdfjsP) pdfjsP=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=PDFJS+'pdf.min.js';
    sc.onload=async()=>{ for(let i=0;i<60&&!window.pdfjsLib;i++) await new Promise(r=>setTimeout(r,50)); if(!window.pdfjsLib){ pdfjsP=null; return rej(new Error('load')); } try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; }catch(e){} res(window.pdfjsLib); };
    sc.onerror=()=>{ pdfjsP=null; rej(new Error('load')); }; document.head.appendChild(sc); });
  return pdfjsP;
}
async function drawPdfPages(){
  const box=$('#vPages'), f=viewing; if(!f) return; const run=++vRun;
  box.innerHTML='<div class="vmsg">Ouverture du document…</div>';
  let lib; try{ lib=await loadPdfJs(); }catch(e){ box.innerHTML='<div class="vmsg">Le lecteur de PDF n’a pas pu être chargé (connexion Internet nécessaire la première fois).<br><br><button class="btn primary" id="vAlt">Ouvrir avec une autre application</button></div>'; $('#vAlt').addEventListener('click',()=>$('#vSave').click()); return; }
  try{
    const doc=await lib.getDocument({data:new Uint8Array(f.data.slice(0))}).promise; if(run!==vRun) return;
    box.innerHTML=''; const W=Math.max(200,box.clientWidth-20), dpr=Math.min(window.devicePixelRatio||1,2.5);
    for(let n=1;n<=doc.numPages;n++){
      const page=await doc.getPage(n); if(run!==vRun) return;
      const base=page.getViewport({scale:1}); const css=W*vScale/base.width; const vp=page.getViewport({scale:css*dpr});
      const c=document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height); c.style.width=Math.floor(vp.width/dpr)+'px'; c.style.height=Math.floor(vp.height/dpr)+'px';
      box.appendChild(c); await page.render({canvasContext:c.getContext('2d'),canvas:c,viewport:vp}).promise;
    }
  }catch(e){ if(run===vRun) box.innerHTML='<div class="vmsg">Ce document n’a pas pu être affiché.<br><br><button class="btn primary" id="vAlt">Ouvrir avec une autre application</button></div>'; const a=$('#vAlt'); if(a) a.addEventListener('click',()=>$('#vSave').click()); }
}
async function viewPdf(fid){
  const f=await get('files',fid); if(!f) return; viewing=f; vScale=1; $('#vZoom').textContent='＋';
  $('#vName').textContent=f.name; $('#viewer').classList.add('open'); document.body.style.overflow='hidden';
  drawPdfPages();
}
$('#vZoom').addEventListener('click',()=>{ vScale=vScale===1?1.8:1; $('#vZoom').textContent=vScale===1?'＋':'－'; drawPdfPages(); });
$('#vClose').addEventListener('click',()=>{ vRun++; $('#vPages').innerHTML=''; $('#viewer').classList.remove('open'); document.body.style.overflow=''; viewing=null; });
$('#vSave').addEventListener('click',()=>{ if(viewing) saveFile(viewing.name.match(/\.pdf$/i)?viewing.name:viewing.name+'.pdf', new Blob([viewing.data],{type:'application/pdf'})); });

function idKey(p){ const n=(p.nom||'').trim().toLowerCase(), q=(p.prenom||'').trim().toLowerCase(); return n&&q&&p.naissance ? n+'|'+q+'|'+p.naissance : null; }
function related(p){ const g=p.groupId||p.id, k=idKey(p); return S.patients.filter(x=>x.id!==p.id && ((x.groupId||x.id)===g || (k && idKey(x)===k))).sort((a,b)=>pDate(b)-pDate(a)); }
function pDate(x){ const d=x.issue&&parseD(x.issue.date); if(d!=null) return d; const i=info(x); return i.ok?i.dpa:(x.createdAt||0); }
function pregLabel(x){ const i=info(x); const y=new Date(pDate(x)).getUTCFullYear(); return x.status==='archived' ? 'Grossesse '+y : i.ok ? 'En cours – DPA '+fd(i.dpa) : 'En cours'; }
function issueSummary(x){
  const o=x.issue; if(!o || !o.type) return '';
  const i=info(x), d=parseD(o.date); const parts=[o.type];
  if(d!=null) parts.push(fd(d)); if(d!=null && i.ok) parts.push(sa(Math.round((d-i.base)/DAY)));
  for(const e of (o.enfants||[])){ const t=[SEXE[e.sexe]||'', e.prenom||'', e.poids?(+e.poids).toLocaleString('fr-FR')+' g':''].filter(Boolean).join(' '); if(t) parts.push(t.toLowerCase().startsWith('fille')||t.toLowerCase().startsWith('garçon')?t.charAt(0).toLowerCase()+t.slice(1):t); }
  return parts.join(', ');
}
function prevFromIssue(prev){

  const pm=[...list(prev.pathoMat),...list(prev.pathoFoet)], cm=complMat(prev);
  return { annee:String(d!=null?new Date(d).getUTCFullYear():new Date(pDate(prev)).getUTCFullYear()), lieu:lieuLabel(o)||lieuLabel(prev), issue:o.type||'',
    terme:d!=null&&i.ok?sa(Math.round((d-i.base)/DAY)):'', presentation:o.presentation||'', sexe:k.sexe||'', prenom:k.prenom||'', poids:k.poids||'',

const pct=(n,d)=>d?(Math.round(n/d*1000)/10).toLocaleString('fr-FR')+' %':'—';

function dimBars(d,F){

    if(code){ const s=await seal(u,code,100000); payload=new Uint8Array(1+16+12+s.c.length); payload[0]=flags|2; payload.set(s.salt,1); payload.set(s.iv,17); payload.set(s.c,29); }
    else { payload=new Uint8Array(1+u.length); payload[0]=flags; payload.set(u,1); }
    const url=base.replace(/#.*$/,'')+'#carte.'+toUrl(u8b64(payload));
    if(url.length<=600||attempt>=drop.length) return url;
    delete o[drop[attempt]];
  }
}
async function readCard(str,code){
  const payload=b64u8(fromUrl(str)); const flags=payload[0]; let u;
  if(flags&2){ if(!code) return {needCode:true}; u=await unseal(payload.slice(29),code,payload.slice(1,17),payload.slice(17,29),100000); }
  else u=payload.slice(1);
  if(flags&1) u=await unzip(u);
  return {data:JSON.parse(new TextDecoder().decode(u))};
}

/* Fichier dossier chiffré */
async function makeDossierFile(p,code,withFiles){
  const q=forPatient(p); let files=[];
  if(withFiles){ for(const m of await filesFor(p.id)){ const f=await get('files',m.id); if(f&&f.data) files.push({name:f.name,cat:f.cat||'',addedAt:f.addedAt,size:f.size,b64:u8b64(new Uint8Array(f.data))}); } }
  let u=new TextEncoder().encode(JSON.stringify({app:'suivi-grossesse-dossier',v:1,exportedAt:new Date().toISOString(),patient:q,files}));
  let z=false; if(canZip()){ u=await zip(u); z=true; }
  const s=await seal(u,code,310000);
  return new Blob([JSON.stringify({app:'suivi-grossesse-dossier-chiffre',v:1,iter:310000,z,salt:u8b64(s.salt),iv:u8b64(s.iv),data:u8b64(s.c)})],{type:'application/json'});
}
async function importDossierFile(file){
  let w; try{ w=JSON.parse(await file.text()); }catch(e){ toast('Fichier illisible'); return; }
  if(!w||w.app!=='suivi-grossesse-dossier-chiffre'){ toast('Ce fichier n’est pas un dossier patiente'); return; }
  const code=await askCode(); if(!code) return;
  let payload;
  try{ let u=await unseal(b64u8(w.data),code,b64u8(w.salt),b64u8(w.iv),w.iter||310000); if(w.z) u=await unzip(u); payload=JSON.parse(new TextDecoder().decode(u)); }
  catch(e){ toast(e&&e.message==='nozip'?'Appareil trop ancien pour lire ce fichier':'Code incorrect'); return; }
  await importPayload(payload,code);
}

/* ---------- QR codes de transfert (dossier complet imprimé) ---------- */
const TQ_CHUNK=600;
QR.dataUrl=(q,scale)=>{ const n=q.size+8, c=document.createElement('canvas'); c.width=c.height=n*scale; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.fillStyle='#000'; for(let y=0;y<q.size;y++) for(let x=0;x<q.size;x++) if(q.modules[y][x]) g.fillRect((x+4)*scale,(y+4)*scale,scale,scale); return c.toDataURL('image/png'); };
async function transferQRs(p,code){
  let u=new TextEncoder().encode(JSON.stringify({app:'suivi-grossesse-dossier',v:1,exportedAt:new Date().toISOString(),patient:forPatient(p),files:[]}));
  let flags=0; if(canZip()){ u=await zip(u); flags|=1; }
  const sl=await seal(u,code,310000); const blob=new Uint8Array(1+16+12+sl.c.length); blob[0]=flags; blob.set(sl.salt,1); blob.set(sl.iv,17); blob.set(sl.c,29);
  const str=toUrl(u8b64(blob)); const n=Math.ceil(str.length/TQ_CHUNK); const tid=newCode();
  return Array.from({length:n},(_,i)=>{ const txt='SGT1|'+tid+'|'+(i+1)+'|'+n+'|'+str.slice(i*TQ_CHUNK,(i+1)*TQ_CHUNK); return {q:QR.encode([...new TextEncoder().encode(txt)],'M'),label:'Transfert '+(i+1)+' / '+n}; });
}
async function importPayload(payload,code){
  const q=payload.patient; if(!q){ toast('Dossier vide'); return; }
  const ex=S.patients.find(x=>(x.status||'active')!=='archived'&&sameIdentity(x,q));
  let target=null;
  if(ex&&isPatient()) target=ex;
  else if(ex){ const c=await choose({title:'Cette patiente a déjà un dossier',body:`Un dossier en cours existe pour ${fullName(ex)}. Voulez-vous le remplacer par le dossier reçu, ou créer un dossier séparé ?`,buttons:[['replace','Remplacer le dossier existant','primary'],['new','Créer un dossier séparé',''],['cancel','Annuler','']]}); if(c==='cancel') return; if(c==='replace') target=ex; }
  const np=Object.assign({},q,{id:target?target.id:uid('p'),createdAt:target?target.createdAt:Date.now(),importedAt:Date.now(),notesPriv:target?target.notesPriv:''});
  if(APP_ROLE==='patient') np.myCode=code; else np.shareCode=(target&&target.shareCode)||code;
  if(target) np.groupId=target.groupId;
  await savePatient(np);
  let n=0; for(const f of list(payload.files)){ try{ await put('files',{id:uid('f'),patientId:np.id,cat:f.cat||'',name:f.name,type:'application/pdf',size:f.size,addedAt:f.addedAt||Date.now(),data:b64u8(f.b64).buffer}); n++; }catch(e){} }
  toast('Dossier importé'+(n?' avec '+n+' document'+(n>1?'s':''):'')); go('patient-'+np.id);
}
let jsqrP=null;
function loadJsQR(){ if(window.jsQR) return Promise.resolve(window.jsQR); if(!jsqrP) jsqrP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload=()=>window.jsQR?res(window.jsQR):rej(new Error('load')); s.onerror=()=>{ jsqrP=null; rej(new Error('load')); }; document.head.appendChild(s); }); return jsqrP; }
function openScanImport(){
  const parts=new Map(); let tid=null, total=0, stream=null, timer=null, busy=false, done=false;
  const z=$('#zoom');
  z.innerHTML=`<header><b>Importer un dossier imprimé</b><button class="btn small" id="scClose">Fermer</button></header>
   <div class="zbody"><p class="note" style="margin:4px 4px 10px">Visez les QR codes « Transfert » de la dernière page, un par un, dans n’importe quel ordre.</p>
   <div class="scanbox"><video id="scVid" playsinline muted></video><div class="scanframe"></div></div>
   <div id="scProg" class="scprog">En attente du premier QR code…</div>
   <div class="actions"><button class="btn" id="scPhoto">📷 Lire depuis une photo</button></div>
   <p class="note">Si la caméra ne s’ouvre pas, prenez chaque QR code en photo (bien cadré, un par photo).</p></div>`;
  z.classList.add('open'); document.body.style.overflow='hidden';
  const stop=()=>{ if(timer) clearInterval(timer); timer=null; if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; };
  const close=()=>{ stop(); z.classList.remove('open'); z.innerHTML=''; document.body.style.overflow=''; };
  $('#scClose').addEventListener('click',close);
  const prog=()=>{ $('#scProg').innerHTML=total?`<b>${parts.size} / ${total}</b> QR code${total>1?'s':''} lu${parts.size>1?'s':''}<div class="scchips">${Array.from({length:total},(_,i)=>`<span class="${parts.has(i+1)?'ok':''}">${i+1}</span>`).join('')}</div>`:'En attente du premier QR code…'; };
  const accept=async txt=>{
    if(done||!txt) return; const m=/^SGT1\|([A-Z0-9]{6})\|(\d+)\|(\d+)\|(.+)$/.exec(txt.trim());
    if(!m){ if(/#carte\./.test(txt)) toast('C’est une carte d’urgence : utilisez les QR codes « Transfert »'); return; }
    const [,id,i,n,data]=m; if(tid&&id!==tid){ toast('Ce QR code appartient à un autre document'); return; }
    if(!tid){ tid=id; total=+n; } if(parts.has(+i)) return;
    parts.set(+i,data); if(navigator.vibrate) navigator.vibrate(40); prog();
    if(parts.size===total){ done=true; stop();
      const str=Array.from({length:total},(_,k)=>parts.get(k+1)).join('');
      const code=await askCode(); if(!code){ close(); return; }
      try{ const b=b64u8(fromUrl(str)); let u=await unseal(b.slice(29),code,b.slice(1,17),b.slice(17,29),310000); if(b[0]&1) u=await unzip(u);
        const payload=JSON.parse(new TextDecoder().decode(u)); close(); await importPayload(payload,code); }
      catch(e){ done=false; toast(e&&e.message==='nozip'?'Appareil trop ancien pour lire ce dossier':'Code incorrect, réessayez'); const c2=await askCode(); if(c2){ try{ const b=b64u8(fromUrl(str)); let u=await unseal(b.slice(29),c2,b.slice(1,17),b.slice(17,29),310000); if(b[0]&1) u=await unzip(u); close(); await importPayload(JSON.parse(new TextDecoder().decode(u)),c2); }catch(e2){ toast('Code incorrect'); close(); } } else close(); }
    }
  };
  const decodeCanvas=async(cv)=>{ const g=cv.getContext('2d'); const d=g.getImageData(0,0,cv.width,cv.height);
    if('BarcodeDetector' in window){ try{ const bd=new BarcodeDetector({formats:['qr_code']}); const r=await bd.detect(cv); for(const x of r) await accept(x.rawValue); if(r.length) return; }catch(e){} }
    const jq=await loadJsQR(); const r=jq(d.data,cv.width,cv.height,{inversionAttempts:'dontInvert'}); if(r&&r.data) await accept(r.data); };
  $('#scPhoto').addEventListener('click',()=>{ const i=$('#imgInput'); i.value=''; i.onchange=async()=>{ for(const f of i.files){ try{ const img=await readImage(f); const im=new Image(); im.src=img.data; await im.decode(); const cv=document.createElement('canvas'); cv.width=img.w; cv.height=img.h; cv.getContext('2d').drawImage(im,0,0); await decodeCanvas(cv); }catch(e){ toast('Lecture impossible (connexion Internet nécessaire la première fois)'); } } if(!done&&total&&parts.size<total) toast('Encore '+(total-parts.size)+' QR code(s) à lire'); }; i.click(); });
  (async()=>{ try{ await loadJsQR(); }catch(e){}
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false}); const v=$('#scVid'); if(!v){ stop(); return; } v.srcObject=stream; await v.play();
      const cv=document.createElement('canvas');
      timer=setInterval(async()=>{ if(busy||done||!v.videoWidth) return; busy=true; try{ cv.width=v.videoWidth; cv.height=v.videoHeight; cv.getContext('2d').drawImage(v,0,0); await decodeCanvas(cv); }catch(e){} busy=false; },300);
    }catch(e){ const sb=$('.scanbox'); if(sb) sb.innerHTML='<div class="vmsg" style="padding:30px 10px">Caméra indisponible ici : utilisez « Lire depuis une photo ».</div>'; } })();
}

/* ---------- Agenda ---------- */
function renderAgenda(){
  const v=$('#view'); const t=today(), N=S.agendaDays;
  const late=[], open=[], soon=[];
  for(const p of S.patients){
    if(p.status && p.status!=='active') continue;
    const inf=info(p); if(!inf.ok) continue;
    for(const it0 of milestonesFor(p,inf)){
      if(it0.st==='fait') continue;
      const it=it0.rdv!=null?Object.assign({},it0,{s:it0.rdv,e:it0.rdv}):it0;
      const row={p,it};
      if(it.kind==='dpa'){ if(it.s>=t && it.s<=t+N*DAY) soon.push(row); continue; }
      if(it.e<t){ if(it.e>=t-30*DAY) late.push(row); }
      else if(it.s<=t) open.push(row);
      else if(it.s<=t+N*DAY) soon.push(row);
    }
  }
  late.sort((a,b)=>b.it.e-a.it.e); open.sort((a,b)=>a.it.e-b.it.e); soon.sort((a,b)=>a.it.s-b.it.s);
  const item=(r,mode)=>{ const it=r.it; let when;
    if(mode==='late') when=`<small style="color:var(--bad)">fenêtre close le ${fds(it.e)}</small>`;
    else if(mode==='open'){ const d=Math.round((it.e-t)/DAY); when=`<small style="color:${d<=7?'var(--warn)':'var(--accent)'}">${it.e===it.s?'aujourd’hui':d===0?'dernier jour':'jusqu’au '+fds(it.e)+' ('+d+' j)'}</small>`; }
    else when=(it.rdv!=null||it.kind==='ev'||(it.kind==='plan'&&it.exact!=null))?rdvHTML(it.rdv??it.exact??it.s,it.time,r.p):`<small style="color:var(--muted)">${fDl.format(it.s)}</small><span class="tofix">date à fixer</span>`;
    if(mode==='open'&&(it.rdv!=null||it.kind==='ev')) when=rdvHTML(it.rdv??it.s,it.time,r.p);
    const can=it.kind!=='dpa';
    return `<div class="ms">${can?`<button class="chk" data-ag="${esc(r.p.id)}|${esc(it.id)}" aria-pressed="false" aria-label="Marquer comme fait : ${esc(it.name)}"></button>`:'<span class="chk" aria-hidden="true" style="border-style:dashed"></span>'}<div class="mn"><b>${esc(it.name)}</b><button class="link" style="padding:0" data-open="${esc(r.p.id)}">${esc(fullName(r.p))}</button></div><div class="md num">${when}</div></div>`; };
  const sec=(title,arr,mode,emptyMsg)=>`<section class="sec"><h2>${title} <span class="num" style="color:var(--muted);font-weight:400">${arr.length}</span></h2><div class="card">${arr.length?arr.map(r=>item(r,mode)).join(''):`<div class="txt" style="color:var(--muted)">${emptyMsg}</div>`}</div></section>`;
  let h=`<div class="summary"><strong>Agenda</strong>Examens et rendez-vous des grossesses en cours</div>`;
  h+=`<div class="seg" role="radiogroup" aria-label="Horizon">${[7,14,30,60].map(n=>`<label><input type="radio" name="hz" value="${n}" ${n===N?'checked':''}><span>${n} jours</span></label>`).join('')}</div>`;
  h+=sec('Fenêtre en cours',open,'open','Aucun examen dont la fenêtre est ouverte.');
  h+=sec(`À venir dans les ${N} jours`,soon,'soon','Rien de prévu sur cette période.');
  h+=sec('Fenêtre dépassée, non validée (30 derniers jours)',late,'late','Aucun oubli récent.');
  v.innerHTML=h;
  $$('input[name="hz"]').forEach(r=>r.addEventListener('change',e=>{ S.agendaDays=+e.target.value; renderAgenda(); }));
  bindRows(v);
  $$('[data-ag]').forEach(b=>b.addEventListener('click',async()=>{ const [pid,mid]=b.dataset.ag.split('|'); const p=S.patients.find(x=>x.id===pid); p.done=p.done||{}; p.done[mid]=iso(today()); await savePatient(p); toast('Marqué comme fait'); renderAgenda(); }));
}
